<div
  name="tinyviewport"
  data-path="torus/testkit/tinyviewport"
  data-part="htmf"
  style="display:block;box-sizing:border-box;max-width:800px;max-height:min(92vh,1200px);overflow-x:auto;overflow-y:auto;position:relative;"
>
  <div
    data-part="shell"
    style="box-sizing:border-box;border:1px solid #2ecc71;padding:6px;width:100%;min-width:0;position:relative;"
  >
    <label>
      tip ib prefix (optional)
      <br />
      <input
        type="text"
        name="tip_prefix"
        data-part="path"
        placeholder="prefix filter (optional) â€” empty = all tips"
        autocomplete="off"
        spellcheck="false"
        size="48"
        style="max-width:100%;box-sizing:border-box;"
      />
    </label>
    <button type="button" data-part="refresh">refresh</button>
    <button type="button" data-part="view-prefix" title="viewport of all tips under this prefix (empty = whole index)">view</button>
    <button type="button" data-part="export-tinyview" title="plant active prefix view as navi:tinyview:{prefix}">export-tinyview</button>
    <span data-part="export-tinyview-confirm" style="display:none;align-items:center;gap:6px;margin-left:4px;">
      <span>y?</span>
      <button type="button" data-part="export-tinyview-yes">yes</button>
    </span>
    <span data-part="status"></span>
    <br />
    <div data-part="manager-bar" style="font:11px/1.35 monospace;margin:0.35rem 0;"></div>
    <div
      data-part="hostpark-mirror"
      style="margin:0.4rem 0;font:11px/1.35 monospace;"
    >
      <label style="display:block;">
        hostpark paths (one per line) â†’ mirror tip+bin into localpark
    <br />
        <textarea
          data-part="hostpark-paths"
          rows="3"
          placeholder="opry/devops/ti_punch/launch/launch.html&#10;ti_punch:devops:ops @span all&#10;navi:relay:log @span reverse 6"
          spellcheck="false"
          style="width:100%;max-width:100%;box-sizing:border-box;font:inherit;"
        ></textarea>
      </label>
      <button type="button" data-part="hostpark-mirror-btn">mirror</button>
      <span data-part="hostpark-status" style="margin-left:0.4rem;transition:opacity 0.5s ease;"></span>
    </div>
    <div data-part="prefs-host" data-part-alias="prefs"></div>
    <br />
    <div data-part="legend" style="font:11px/1.35 monospace;margin:0.25rem 0;display:flex;flex-direction:column;gap:4px;"></div>
    <div
      data-part="viewport"
      style="width:100%;min-width:0;box-sizing:border-box;overflow-x:auto;"
    ></div>
  </div>

  <script>
    (function () {
      const root =
        document.currentScript?.closest('div[name="tinyviewport"]') ||
        document.querySelector('div[name="tinyviewport"][data-part="htmf"]');
      if (!root) return;

      const PREFS_KEY = "navi:tinyviewport:prefs";
      const HOSTPARK_MIRROR_KEY = "navi:tinyviewport:hostpark_mirrors";
      const TINYVIEW_IB_PREFIX = "navi:tinyview:";
      const FRAME_PREFIX = "navi:ibgib:frame:";
      const TIP_PREFIX = "navi:ibgib:tip:";
      const MANAGER_SUBJECT =
        "flowerpot/hypercloud/testkit/mods/legacy/tinyviewport_manager.js";
      const MANAGER_WAREZ_MANIFEST =
        "flowerpot/hypercloud/testkit/mods/tinyviewport_manager";
      const HTMF_BUILD = "tv-lineage-time-scrub";
      const SQ = 18;
      const GAP = 6;
      const ROW_H = 28;
      /** Grow HTMF up to this when a graph board is wider than the base 800px. */
      const HTMF_BASE_MAX = 800;
      const HTMF_EXPAND_CAP = () =>
        Math.min(Math.floor(window.innerWidth * 0.96), 1600);
      const HTMF_CHROME = 48;
      let htmfWidthNeed = HTMF_BASE_MAX;
      const noteHtmfWidth = (boardW) => {
        htmfWidthNeed = Math.max(
          htmfWidthNeed,
          Math.ceil(Number(boardW) || 0) + HTMF_CHROME
        );
      };
      const applyHtmfWidth = () => {
        const cap = HTMF_EXPAND_CAP();
        const w = Math.min(cap, Math.max(HTMF_BASE_MAX, htmfWidthNeed));
        root.style.maxWidth = `${w}px`;
      };
      const resetHtmfWidth = () => {
        htmfWidthNeed = HTMF_BASE_MAX;
      };
      const EDGE = {
        past: "#888888",
        cascade: "#2ecc71",
        other: "#c0392b",
        tip: "#4a90d9",
        orphan: "#9b59b6",
        hostpark: "#8e44ad",
      };
      const DEFAULT_PREFS = {
        border: "#c0c0c0",
        hostpark: EDGE.hostpark,
        text: "#111111",
        bg: "#ffffff",
        previewOverlay: true,
        /** Nested tip-list by path segments (delimiter-nest) */
        nesting: false,
        /** Node appearance â€” default black squares showing only n */
        nodeFill: "#000000",
        nodeText: "#ffffff",
        nodeStroke: "#000000",
        /** Graph scale percent: 0â€“200, default 100 */
        scale: 100,
        /**
         * Lineage time scrub (ISO or ms). When lineage+flowchart are on, nodes
         * after this stamp dim. null = latest (no scrub).
         */
        timelineAt: null,
      };
      const FALLBACK_LEGEND = [
        { id: "tip", label: "tip", color: EDGE.tip, kind: "swatch" },
        {
          id: "hostpark",
          label: "hostpark mirror (this pipe)",
          color: EDGE.hostpark,
          kind: "swatch",
        },
        { id: "past", label: "past", color: EDGE.past, kind: "line" },
        {
          id: "cascade",
          label: "cascade / mutation_of",
          color: EDGE.cascade,
          kind: "line",
        },
        { id: "other", label: "other rel8n", color: EDGE.other, kind: "line" },
        { id: "orphan", label: "orphan", color: EDGE.orphan, kind: "swatch" },
      ];

      /** @type {{ prefix: string, ibs: string[], selectedIb: string|null, graph: any|null, prefixViewOpen: boolean, prefixGraph: any|null, spaceBytes: number|null, spaceBytesLabel: string, expandedPaths: Set<string>, sidebarActions: any[] }} */
      const state = {
        prefix: "",
        ibs: [],
        selectedIb: null,
        graph: null,
        prefixViewOpen: false,
        prefixGraph: null,
        /** Tip+bin payload bytes for current ib list; null = not measured yet. */
        spaceBytes: null,
        spaceBytesLabel: "",
        expandedPaths: new Set(),
        sidebarActions: [],
      };
      /** ibs successfully mirrored through this fragment's hostpark pipe */
      /** @type {Set<string>} */
      let hostparkMirrorIbs = new Set();

      const part = (name) => root.querySelector(`[data-part="${name}"]`);
      const pathEl = part("path");
      const viewport = part("viewport");
      const statusEl = part("status");
      if (!viewport) {
        console.error("[tinyviewport] missing [data-part=viewport]");
        return;
      }
      const refreshBtn = part("refresh");
      const nestingEl = () => part("pref-nesting");
      const viewPrefixBtn = part("view-prefix");
      const exportTinyviewBtn = part("export-tinyview");
      const exportTinyviewConfirm = part("export-tinyview-confirm");
      const exportTinyviewYes = part("export-tinyview-yes");
      const prefsHost = part("prefs-host");
      const borderEl = () => part("pref-border");
      const hostparkEl = () => part("pref-hostpark");
      const textEl = () => part("pref-text");
      const bgEl = () => part("pref-bg");
      const nodeFillEl = () => part("pref-node-fill");
      const nodeTextEl = () => part("pref-node-text");
      const nodeStrokeEl = () => part("pref-node-stroke");
      const previewOverlayEl = () => part("pref-preview-overlay");
      const legendEl = part("legend");
      const managerBar = part("manager-bar");
      const hostparkPathsEl = part("hostpark-paths");
      const hostparkMirrorBtn = part("hostpark-mirror-btn");
      const hostparkStatusEl = part("hostpark-status");
      const shellEl = part("shell");

      /** In-memory mirror of persisted prefs (manager tip, or fragment fallback). */
      let prefsState = { ...DEFAULT_PREFS };
      /** Live scale % while slider drags (null = use prefsState.scale). */
      let liveScalePct = null;
      /** Live lineage scrub ms while slider drags (null = use prefsState.timelineAt). */
      let liveTimelineMs = null;
      /** Exported tinyview tip mode â€” chrome stripped, state from data-path tip. */
      let tinyviewMode = false;
      /** @type {any|null} */
      let tinyviewManifest = null;

      let floatEl = null;
      let floatAddr = null;
      let unwatchManager = null;

      const getManager = () =>
        globalThis.navi?.mod?.tinyviewport_manager || null;

      const setStatus = (text) => {
        if (statusEl) statusEl.textContent = text || "";
      };

      const tipApi = () => {
        const tip = globalThis.navi?.storage?.tip;
        if (!tip || typeof tip.list !== "function" || typeof tip.get !== "function") {
          throw new Error("navi.storage.tip unavailable");
        }
        return tip;
      };

      const itemApi = () => {
        const item = globalThis.navi?.storage?.item;
        if (!item || typeof item.get !== "function") {
          throw new Error("navi.storage.item unavailable");
        }
        return item;
      };

      const formatSpaceBytes = (n) => {
        const v = Math.max(0, Number(n) || 0);
        if (v < 1024) return `${Math.round(v)} B`;
        if (v < 1024 * 1024) return `${(v / 1024).toFixed(v < 10 * 1024 ? 1 : 0)} KB`;
        if (v < 1024 * 1024 * 1024) {
          return `${(v / (1024 * 1024)).toFixed(v < 10 * 1024 * 1024 ? 1 : 0)} MB`;
        }
        return `${(v / (1024 * 1024 * 1024)).toFixed(2)} GB`;
      };

      const utf8Bytes = (s) => {
        const t = String(s ?? "");
        if (typeof TextEncoder !== "undefined") {
          try {
            return new TextEncoder().encode(t).length;
          } catch {
            /* fall through */
          }
        }
        return t.length;
      };

      const binShaFromRef = (ref) => {
        const m = String(ref || "")
          .trim()
          .match(/^bin\s+([0-9a-fA-F]+)$/);
        return m ? m[1].toLowerCase() : "";
      };

      /**
       * One-shot measure of tip records + linked bins for the current ib list.
       * Called on initial load and refresh only (cached on state.spaceBytes).
       */
      const measureTipBinSpace = async (ibs) => {
        const list = Array.isArray(ibs) ? ibs : [];
        const tip = tipApi();
        const binApi = globalThis.navi?.storage?.bin;
        const seenBin = new Set();
        let total = 0;
        for (const ib of list) {
          let frame = null;
          try {
            frame = await tip.get(ib);
          } catch {
            frame = null;
          }
          if (!frame) continue;
          try {
            total += utf8Bytes(JSON.stringify(frame));
          } catch {
            total += 64;
          }
          const refs = Array.isArray(frame.rel8ns?.bin) ? frame.rel8ns.bin : [];
          for (const ref of refs) {
            const sha = binShaFromRef(ref);
            if (!sha || seenBin.has(sha)) continue;
            seenBin.add(sha);
            if (!binApi?.get) continue;
            try {
              const bin = await binApi.get(sha);
              if (bin?.media != null) total += utf8Bytes(bin.media);
              else total += 32;
            } catch {
              total += 32;
            }
          }
        }
        return total;
      };

      const refreshSpaceLabel = async (ibs) => {
        try {
          const bytes = await measureTipBinSpace(ibs);
          state.spaceBytes = bytes;
          state.spaceBytesLabel = formatSpaceBytes(bytes);
        } catch (err) {
          state.spaceBytes = null;
          state.spaceBytesLabel = "";
          console.warn("[tinyviewport] space measure failed", err);
        }
      };

      const tipsCountLabel = () => {
        const n = state.ibs.length;
        const base = state.prefix
          ? `prefix â€œ${state.prefix}â€ Â· ${n} tip(s)`
          : `entire index Â· ${n} tip(s)`;
        return state.spaceBytesLabel
          ? `${base} Â· ${state.spaceBytesLabel}`
          : base;
      };

      const tinyviewHintLabel = () => {
        const prefix = normalizePrefix(state.prefix || "");
        const nodes = state.prefixGraph?.nodes?.size;
        const bits = [
          "tinyview",
          prefix ? `prefix â€œ${prefix}â€` : "all tips",
          nodes != null ? `${nodes} node(s)` : "",
        ].filter(Boolean);
        return bits.join(" Â· ");
      };

      /** @type {{ live: string, warez: string, subjectIb: string }|null} */
      let managerUpdateOffer = null;
      let managerUpdateChecking = false;

      const flowerpotBase = () => {
        const origin = String(
          globalThis.navi?.origin || globalThis.location?.origin || ""
        ).replace(/\/+$/, "");
        return origin ? `${origin}/flowerpot` : "https://foobarch.net/flowerpot";
      };

      const bareRoute = (route) =>
        String(route || "")
          .replace(/^flowerpot\//i, "")
          .replace(/^\/+/, "");

      const isVersionOutdated = (live, warez) => {
        const want = String(warez || "").trim();
        if (!want) return false;
        const have = String(live || "").trim();
        if (!have) return true;
        if (have === want) return false;
        const parse = (v) =>
          String(v)
            .split(/[.+-]/)
            .map((x) => {
              const n = parseInt(x, 10);
              return Number.isFinite(n) ? n : 0;
            });
        const a = parse(have);
        const b = parse(want);
        const n = Math.max(a.length, b.length);
        for (let i = 0; i < n; i++) {
          const x = a[i] || 0;
          const y = b[i] || 0;
          if (x < y) return true;
          if (x > y) return false;
        }
        return false;
      };

      const fetchManagerWarezInfo = async () => {
        const ib = bareRoute(MANAGER_WAREZ_MANIFEST);
        const url = `${flowerpotBase()}/${ib}`;
        const res = await fetch(url);
        const text = await res.text();
        if (!res.ok) throw new Error(`${res.status}: ${text.slice(0, 120)}`);
        const man = JSON.parse(text);
        const about = man.about || {};
        const subject = man.subject || {};
        return {
          version: about.version != null ? String(about.version) : "",
          subjectIb: String(subject.ib || MANAGER_SUBJECT).trim(),
        };
      };

      const mountManagerFromSubject = async (subjectIb) => {
        const path = String(subjectIb || MANAGER_SUBJECT).replace(/^\/+/, "");
        const navi = globalThis.navi;
        if (!navi?.mount) throw new Error("navi.mount unavailable");
        const key = "tinyviewport_manager";
        if (navi.mod?.[key]) {
          const surf = navi.mod?.surf;
          if (surf && typeof surf.unmount === "function") {
            await surf.unmount(key);
          } else if (typeof navi.unmount === "function") {
            await navi.unmount(key);
          }
        }
        let code = null;
        if (typeof navi.fetch === "function") {
          const res = await navi.fetch(path);
          if (res && typeof res.text === "function") {
            code = await res.text();
            if (!res.ok) {
              throw new Error(`${res.status}: ${String(code).slice(0, 120)}`);
            }
          }
        }
        if (!code) {
          const url = `${flowerpotBase()}/${bareRoute(path)}`;
          const r = await fetch(url);
          code = await r.text();
          if (!r.ok) throw new Error(`${r.status}: ${code.slice(0, 120)}`);
        }
        await navi.mount(String(code));
        try {
          const legacy = await itemApi().get(PREFS_KEY);
          const m = getManager();
          if (
            legacy &&
            typeof legacy === "object" &&
            m &&
            typeof m.patchPrefs === "function"
          ) {
            await m.patchPrefs(
              fragmentToMgrPatch({ ...DEFAULT_PREFS, ...legacy })
            );
          }
        } catch {
          /* ignore */
        }
        wireManager();
        await loadPrefs();
        await mountPrefsHost();
        managerUpdateOffer = null;
        renderManagerBar();
        await renderLegend();
        if (state.selectedIb) await rerenderOpenGraph();
        else await renderList();
      };

      const checkManagerUpdate = async () => {
        if (tinyviewMode) return;
        const mgr = getManager();
        if (!mgr) {
          managerUpdateOffer = null;
          return;
        }
        managerUpdateChecking = true;
        renderManagerBar();
        try {
          const info = await fetchManagerWarezInfo();
          const live = String(mgr.version || mgr.moduleInfo?.version || "");
          if (isVersionOutdated(live, info.version)) {
            managerUpdateOffer = {
              live,
              warez: info.version,
              subjectIb: info.subjectIb || MANAGER_SUBJECT,
            };
          } else {
            managerUpdateOffer = null;
          }
        } catch (err) {
          console.warn("[tinyviewport] manager update check failed", err);
          managerUpdateOffer = null;
        } finally {
          managerUpdateChecking = false;
          renderManagerBar();
        }
      };

      const renderManagerBar = () => {
        if (!managerBar) return;
        if (tinyviewMode) {
          managerBar.textContent = "";
          managerBar.style.display = "none";
          return;
        }
        managerBar.style.display = "";
        managerBar.textContent = "";
        const mgr = getManager();
        const build = document.createElement("span");
        build.style.opacity = "0.75";
        build.textContent = `htmf ${HTMF_BUILD} Â· `;
        managerBar.appendChild(build);
        if (mgr) {
          const ok = document.createElement("span");
          ok.style.color = "#2ecc71";
          const fc = mgr.listPlugins?.()?.find?.((p) => p.id === "flowchart");
          const fcBit = fc
            ? ` Â· flowchart ${fc.layout?.rev || "?"}`
            : "";
          ok.textContent = `manager v${mgr.version || "?"} Â· plugins via checkboxes${fcBit}`;
          managerBar.appendChild(ok);
          if (managerUpdateChecking) {
            const checking = document.createElement("span");
            checking.style.cssText = "margin-left:0.5rem;opacity:0.7;";
            checking.textContent = " Â· checking warezâ€¦";
            managerBar.appendChild(checking);
          } else if (managerUpdateOffer) {
            const offer = document.createElement("span");
            offer.style.cssText = "margin-left:0.5rem;";
            const note = document.createElement("span");
            note.style.color = "#c0392b";
            note.textContent = ` Â· update ${managerUpdateOffer.live || "?"} â†’ ${managerUpdateOffer.warez} `;
            offer.appendChild(note);
            const upd = document.createElement("button");
            upd.type = "button";
            upd.textContent = "update manager";
            upd.title = managerUpdateOffer.subjectIb;
            upd.addEventListener("click", () => {
              void (async () => {
                try {
                  upd.disabled = true;
                  setStatus(
                    `updating tinyviewport_manager â†’ v${managerUpdateOffer.warez}â€¦`
                  );
                  await mountManagerFromSubject(managerUpdateOffer.subjectIb);
                  setStatus(
                    `tinyviewport_manager updated to v${getManager()?.version || managerUpdateOffer.warez}`
                  );
                } catch (err) {
                  upd.disabled = false;
                  setStatus(String(err?.message || err));
                }
              })();
            });
            offer.appendChild(upd);
            managerBar.appendChild(offer);
          }
          return;
        }
        const msg = document.createElement("span");
        msg.textContent =
          "optional tinyviewport_manager not mounted â€” lineage only. ";
        managerBar.appendChild(msg);
        const btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = "mount from warez";
        btn.title = MANAGER_SUBJECT;
        btn.addEventListener("click", () => {
          void (async () => {
            try {
              setStatus("mounting tinyviewport_managerâ€¦");
              btn.disabled = true;
              await mountManagerFromSubject(MANAGER_SUBJECT);
              setStatus("tinyviewport_manager mounted");
              void checkManagerUpdate();
            } catch (err) {
              btn.disabled = false;
              setStatus(String(err?.message || err));
            }
          })();
        });
        managerBar.appendChild(btn);
      };

      let legendRenderSeq = 0;

      const refreshGraphAfterPluginChange = async () => {
        if (state.prefixViewOpen) {
          state.prefixGraph = await collectPrefixGraph(state.ibs);
          await renderList();
          return;
        }
        if (state.selectedIb) await rerenderOpenGraph();
        else await renderList();
      };

      const appendLegendContent = async (host, opts = {}) => {
        const compact = !!opts.compact;
        const showNote = opts.showNote !== false;
        const seq = opts.seq;
        const mgr = getManager();
        if (!mgr) {
          for (const L of FALLBACK_LEGEND) {
            if (seq != null && seq !== legendRenderSeq) return false;
            const line = document.createElement("div");
            const span = document.createElement("span");
            span.style.color = L.color;
            span.textContent =
              (L.kind === "line" ? "â” " : "â–  ") + L.label;
            line.appendChild(span);
            host.appendChild(line);
          }
          if (showNote && !compact) {
            const note = document.createElement("div");
            note.style.opacity = "0.75";
            note.textContent =
              "extra rows = split lineages (no past after prune)";
            host.appendChild(note);
          }
          return true;
        }
        await mgr.loadPrefs();
        if (seq != null && seq !== legendRenderSeq) return false;
        for (const p of mgr.listPlugins()) {
          if (p.chromeOnly) continue;
          const on = await mgr.isPluginEnabled(p.id);
          if (seq != null && seq !== legendRenderSeq) return false;
          const block = document.createElement("div");
          block.style.cssText = compact
            ? "display:block;margin:0 0 4px 0"
            : "display:block;margin:0 0 2px 0";
          const lab = document.createElement("label");
          lab.style.cssText = compact
            ? "display:flex;align-items:flex-start;gap:4px;cursor:pointer;margin:0;font:10px/1.3 monospace"
            : "display:flex;align-items:center;gap:4px;cursor:pointer;margin:0";
          const cb = document.createElement("input");
          cb.type = "checkbox";
          cb.checked = !!on;
          cb.dataset.pluginId = p.id;
          cb.addEventListener("change", () => {
            void mgr.setPluginEnabled(p.id, cb.checked);
          });
          lab.appendChild(cb);
          const name = document.createElement("span");
          name.textContent = p.label;
          lab.appendChild(name);
          block.appendChild(lab);
          if (on && (p.legend || []).length) {
            const items = document.createElement("div");
            items.style.cssText = compact
              ? "padding-left:1em;margin-top:2px"
              : "padding-left:1.15em";
            for (const L of p.legend || []) {
              const line = document.createElement("div");
              line.style.color = L.color || "#888";
              line.textContent = `â” ${L.label}`;
              items.appendChild(line);
            }
            block.appendChild(items);
          }
          host.appendChild(block);
        }
        if (showNote && !compact) {
          if (seq != null && seq !== legendRenderSeq) return false;
          const note = document.createElement("div");
          note.style.cssText = "opacity:0.75;margin-top:2px";
          note.textContent =
            "drag nodes to reposition. foreign rows = other ibs.";
          host.appendChild(note);
        }
        return true;
      };

      const renderLegend = async () => {
        if (!legendEl) return;
        const seq = ++legendRenderSeq;
        legendEl.replaceChildren();
        if (tinyviewMode) {
          legendEl.style.display = "none";
          if (state.prefixViewOpen) await renderList();
          return;
        }
        legendEl.style.display = "flex";
        await appendLegendContent(legendEl, { seq, showNote: true });
      };

      const wireManager = () => {
        if (unwatchManager) {
          try {
            unwatchManager();
          } catch {
            /* ignore */
          }
          unwatchManager = null;
        }
        const mgr = getManager();
        if (mgr && typeof mgr.onChange === "function") {
          unwatchManager = mgr.onChange(() => {
            void (async () => {
              try {
                await loadPrefs();
              } catch {
                /* ignore */
              }
              await mountPrefsHost();
              await renderLegend();
              await refreshGraphAfterPluginChange();
            })();
          });
        }
      };

      /** Prefer manager.collectGraph; else local loadGraph (lineage only). */
      const resolveGraph = async (ib, opts = {}) => {
        const mgr = getManager();
        if (mgr && typeof mgr.collectGraph === "function") {
          const g = await mgr.collectGraph(ib, opts);
          const layout = Array.isArray(g.layout) ? g.layout : await resolveLayoutPlans(g);
          g.layout = layout;
          if (layout.length) inheritLayoutBands(g.nodes, layout);
          const sameIb = [...g.nodes.values()]
            .filter((n) => String(n.ib || "") === String(ib))
            .map((n) => n.addr);
          return {
            ...g,
            layout,
            bandLayout: layout.length > 0,
            // legacy alias used in a few call sites
            flowMode: layout.length > 0,
            directAddrs: sameIb,
            lineages: [],
            leafTips: [],
            frameStoreCount: sameIb.length,
            viaManager: true,
          };
        }
        const g = await loadGraph(ib);
        g.viaManager = false;
        g.layout = [];
        g.bandLayout = false;
        g.flowMode = false;
        return g;
      };

      /** Merge graphs for every tip under the current prefix filter. */
      const collectPrefixGraph = async (ibs) => {
        const nodes = new Map();
        const edges = [];
        const edgeKey = new Set();
        let viaManager = false;
        const sources = new Set();
        const mgr = getManager();
        let prefs = null;
        if (mgr && typeof mgr.loadPrefs === "function") {
          try {
            prefs = await mgr.loadPrefs();
          } catch {
            prefs = null;
          }
        }

        const isPluginBandRow = (row) => {
          const r = String(row || "");
          if (!r.includes(":")) return false;
          if (
            r.startsWith("ib:") ||
            r.startsWith("lineage:") ||
            r === "main" ||
            r === "orphan" ||
            r.startsWith("foreign")
          ) {
            return false;
          }
          return true;
        };

        const pluginRowFor = (node) => {
          if (node?.layoutPrefix && node?.layoutBand) {
            return `${node.layoutPrefix}:${node.layoutBand}`;
          }
          if (node?.flowBand) return `flow:${node.flowBand}`;
          if (isPluginBandRow(node?.row)) return String(node.row);
          return "";
        };

        /** @type {any[]} */
        let layout = [];
        for (const ib of ibs) {
          const g = await resolveGraph(ib, { viewIbs: ibs });
          if (g.viaManager) viaManager = true;
          if (Array.isArray(g.layout) && g.layout.length) layout = g.layout;
          for (const s0 of g.sources || []) sources.add(s0);
          for (const [addr, node] of g.nodes) {
            const prev = nodes.get(addr);
            // Prefer plugin band row always â€” never collapse flow:* into ib:*
            // (that stacked one row per tip and shoved the graph to the bottom).
            const pluginRow = pluginRowFor(node) || pluginRowFor(prev || {});
            const row =
              pluginRow ||
              (String(node.row || "").startsWith("ib:")
                ? node.row
                : `ib:${ib}`);
            const merged = {
              ...(prev || {}),
              ...node,
              addr,
              row,
            };
            // Keep layout stamps from either side
            if (!merged.layoutPrefix && prev?.layoutPrefix) {
              merged.layoutPrefix = prev.layoutPrefix;
            }
            if (!merged.layoutBand && prev?.layoutBand) {
              merged.layoutBand = prev.layoutBand;
            }
            if (merged.layoutOrder == null && prev?.layoutOrder != null) {
              merged.layoutOrder = prev.layoutOrder;
            }
            if (merged.layoutBandRank == null && prev?.layoutBandRank != null) {
              merged.layoutBandRank = prev.layoutBandRank;
            }
            if (!merged.flowBand && prev?.flowBand) merged.flowBand = prev.flowBand;
            if (!merged.flowKind && prev?.flowKind) merged.flowKind = prev.flowKind;
            if (!merged.flowMeta && prev?.flowMeta) merged.flowMeta = prev.flowMeta;
            if (merged.flowLayoutOrder == null && prev?.flowLayoutOrder != null) {
              merged.flowLayoutOrder = prev.flowLayoutOrder;
            }
            nodes.set(addr, merged);
          }
          for (const e of g.edges || []) {
            const k = `${e.from}|${e.to}|${e.rel}|${e.source || ""}`;
            if (edgeKey.has(k)) continue;
            edgeKey.add(k);
            edges.push(e);
          }
        }

        // Always take the live plan last â€” per-ib collectGraph may have stamped
        // an older layout onto `layout` before a companion remount.
        try {
          const live = await resolveLayoutPlans(null);
          if (live.length) layout = live;
        } catch {
          /* keep merged */
        }
        if (!layout.length) layout = synthesizeLayoutFromNodes(nodes);
        if (layout.length) inheritLayoutBands(nodes, layout);

        return {
          base: state.prefix || "(all)",
          nodes,
          edges,
          prefs: prefs || { offsets: {} },
          viaManager,
          sources: [...sources],
          prefixView: true,
          layout,
          bandLayout: layout.length > 0,
          flowMode: layout.length > 0,
        };
      };

      const resolveFetchUrl = (path) => {
        const navi = globalThis.navi;
        const raw = String(path || "").replace(/^\/+/, "");
        if (typeof navi?.resolveUrl === "function") {
          try {
            const u = navi.resolveUrl(raw);
            if (typeof u === "string") return u;
            if (u && typeof u.href === "string") return u.href;
          } catch {
            /* fall through */
          }
        }
        return `/${raw}`;
      };

      const bytesToMediaString = (bytes, mime) => {
        const ct = String(mime || "").toLowerCase();
        const u8 = bytes instanceof Uint8Array ? bytes : new Uint8Array(bytes);
        if (
          ct.startsWith("text/") ||
          ct.includes("json") ||
          ct.includes("javascript") ||
          ct.includes("xml") ||
          ct.includes("html") ||
          ct.includes("svg") ||
          ct.includes("lua") ||
          ct.includes("navi-module")
        ) {
          return new TextDecoder("utf-8").decode(u8);
        }
        let s = "";
        for (let i = 0; i < u8.length; i++) s += String.fromCharCode(u8[i]);
        return s;
      };

      /** GET foobarch tip JSON from hostpark (same origin / resolveUrl). */
      const fetchHostparkTip = async (ibRaw) => {
        const ib = normalizePrefix(ibRaw);
        if (!ib) throw new Error("empty path");
        const url = resolveFetchUrl(`foobarch/tip/${ib}`);
        const res = await fetch(url, { method: "GET" });
        if (res.status === 404) return null;
        const text = await res.text();
        if (!res.ok) {
          throw new Error(`${res.status}: ${text.slice(0, 120)}`);
        }
        return JSON.parse(text);
      };

      const fetchHostparkFrame = async (addrRaw) => {
        const addr = String(addrRaw || "").trim();
        if (!addr) return null;
        const url = resolveFetchUrl(
          `foobarch/frame/${encodeURIComponent(addr)}`
        );
        const res = await fetch(url, { method: "GET" });
        if (res.status === 404) return null;
        const text = await res.text();
        if (!res.ok) {
          throw new Error(`${res.status}: ${text.slice(0, 120)}`);
        }
        return JSON.parse(text);
      };

      const fetchHostparkSpan = async (ibRaw, span) => {
        const ib = normalizePrefix(ibRaw);
        const params = new URLSearchParams();
        params.set("dir", String(span?.dir || "reverse").toLowerCase());
        if (span?.limit != null && Number.isFinite(Number(span.limit))) {
          params.set("limit", String(span.limit));
        }
        if (span?.offset != null && Number.isFinite(Number(span.offset))) {
          params.set("offset", String(span.offset));
        }
        const url = resolveFetchUrl(`foobarch/span/${ib}?${params}`);
        const res = await fetch(url, { method: "GET" });
        if (res.status === 404) return [];
        const text = await res.text();
        if (!res.ok) {
          throw new Error(`${res.status}: ${text.slice(0, 120)}`);
        }
        const parsed = JSON.parse(text);
        const hits = Array.isArray(parsed?.hits) ? parsed.hits : [];
        return hits.map((hit) =>
          typeof hit === "string"
            ? { addr: hit, frame: null }
            : {
                addr: hit.addr,
                frame: hit.frame || null,
              }
        );
      };

      const walkHostparkLineage = async (ibRaw) => {
        const tipRow = await fetchHostparkTip(ibRaw);
        if (!tipRow?.frame) return [];
        const hits = [];
        const seen = new Set();
        let frame = tipRow.frame;
        let addr = tipRow.addr || frameAddr(frame);
        while (frame && addr && !seen.has(addr)) {
          seen.add(addr);
          hits.push({ addr, frame });
          const past0 = Array.isArray(frame.rel8ns?.past)
            ? String(frame.rel8ns.past[0] || "").trim()
            : "";
          if (!past0) break;
          frame = await fetchHostparkFrame(past0);
          addr = past0;
        }
        return hits;
      };

      const orderHostparkSpan = (chain, span) => {
        const dir = String(span?.dir || "reverse").toLowerCase();
        let ordered =
          dir === "forward" || dir === "all"
            ? chain.slice().reverse()
            : chain;
        const offset = Math.max(0, Number(span?.offset) || 0);
        if (span?.limit != null && Number.isFinite(Number(span.limit))) {
          ordered = ordered.slice(
            offset,
            offset + Math.max(0, Math.floor(Number(span.limit)))
          );
        } else {
          ordered = ordered.slice(offset);
        }
        return ordered;
      };

      const parseMirrorPathSpec = (raw) => {
        const s = String(raw || "").trim();
        const m = s.match(
          /^(.+?)\s+@span(?:\s+(reverse|forward|all))?(?:\s+(\d+))?\s*$/i
        );
        if (!m) return { ib: normalizePrefix(s), span: null };
        return {
          ib: normalizePrefix(m[1]),
          span: {
            dir: String(m[2] || "reverse").toLowerCase(),
            ...(m[3] != null ? { limit: Number(m[3]) } : {}),
          },
        };
      };

      const plantHostparkFrame = async (frame) => {
        const ib = String(frame?.ib || "").trim();
        if (!ib) throw new Error("frame missing ib");
        const binRef = Array.isArray(frame.rel8ns?.bin)
          ? frame.rel8ns.bin[0]
          : null;
        const sha = String(binRef || "")
          .trim()
          .match(/^bin\s+([0-9a-fA-F]+)$/i)?.[1]
          ?.toLowerCase();
        if (sha) {
          const bodyUrl = resolveFetchUrl(ib);
          const res = await fetch(bodyUrl, { method: "GET" });
          if (!res.ok) {
            throw new Error(`bin GET ${res.status} (tip ok, body missing)`);
          }
          const mime =
            frame.data?.content_type ||
            res.headers.get("Content-Type") ||
            "application/octet-stream";
          const bytes = new Uint8Array(await res.arrayBuffer());
          const media = bytesToMediaString(bytes, mime);
          await globalThis.navi?.storage?.bin?.put?.(sha, {
            media,
            mime: String(mime),
          });
        }
        // tip.set (not frame.put) â€” frame.put alone leaves no tip pointer, so tip.list() stays empty.
        await tipApi().set(frame);
        return ib;
      };

      const mirrorHostparkSpan = async (ibRaw, span) => {
        const ib = normalizePrefix(ibRaw);
        let picks = await fetchHostparkSpan(ib, span);
        if (!picks.length) {
          const chain = await walkHostparkLineage(ib);
          if (!chain.length) throw new Error("no hostpark lineage");
          picks = orderHostparkSpan(chain, span);
        }
        const mirrored = [];
        for (const hit of picks) {
          let frame = hit.frame;
          if (!frame && hit.addr) {
            frame = await fetchHostparkFrame(hit.addr);
          }
          if (!frame) continue;
          await plantHostparkFrame(frame);
          mirrored.push(frame.ib || ib);
        }
        const head = picks[0]?.frame || (picks[0]?.addr && (await fetchHostparkFrame(picks[0].addr)));
        if (head) await tipApi().set(head);
        return { ib, count: mirrored.length, mirrored };
      };

      /**
       * Plant hostpark tip+bin into localpark at the same ib (frame unchanged).
       * Bin bytes come from GET /{ib} when rel8ns.bin is present.
       */
      const mirrorHostparkPath = async (pathRaw) => {
        const spec = parseMirrorPathSpec(pathRaw);
        if (spec.span) {
          return mirrorHostparkSpan(spec.ib, spec.span);
        }
        const ib = spec.ib;
        if (!ib) throw new Error("empty path");
        const tipRow = await fetchHostparkTip(ib);
        if (!tipRow || tipRow.tombstone || !tipRow.frame) {
          throw new Error("no hostpark frame");
        }
        await plantHostparkFrame(tipRow.frame);
        return { ib, addr: tipRow.addr || frameAddr(tipRow.frame) };
      };

      const runHostparkMirror = async () => {
        const raw = String(hostparkPathsEl?.value || "");
        const paths = raw
          .split(/\r?\n/)
          .map((l) => l.trim())
          .filter(Boolean);
        if (!paths.length) {
          setHostparkStatus("no hostpark frame â€” enter a path", mirrorStatusFade);
          return;
        }
        hostparkMirrorBtn.disabled = true;
        setHostparkStatus(`mirroring ${paths.length}â€¦`);
        const ok = [];
        const fail = [];
        for (const p of paths) {
          try {
            const r = await mirrorHostparkPath(p);
            ok.push(r.ib || p);
          } catch (err) {
            fail.push({
              path: p,
              err: String(err?.message || err),
            });
          }
        }
        hostparkMirrorBtn.disabled = false;
        if (!ok.length && fail.length === 1) {
          setHostparkStatus(
            `no hostpark frame â€” ${fail[0].err}`,
            mirrorStatusFade
          );
        } else if (!ok.length) {
          setHostparkStatus(
            `no hostpark frame â€” ${fail.length} failed (${fail
              .map((f) => f.path)
              .join(", ")})`,
            mirrorStatusFade
          );
        } else if (fail.length) {
          setHostparkStatus(
            `mirrored ${ok.length}; failed ${fail.length}: ${fail
              .map((f) => `${f.path} (${f.err})`)
              .join("; ")}`,
            mirrorStatusFade
          );
        } else {
          setHostparkStatus(
            `mirrored ${ok.length}: ${ok.join(", ")}`,
            mirrorStatusFade
          );
        }
        if (ok.length) await rememberHostparkMirrors(ok);
        await refresh();
        if (ok.length && state.prefixViewOpen) {
          await openPrefixView();
        }
      };

      const normalizePrefix = (raw) =>
        String(raw || "")
          .trim()
          .replace(/^\/+/, "");

      const tinyviewIbForPrefix = (prefix) => {
        const p = normalizePrefix(prefix);
        return `${TINYVIEW_IB_PREFIX}${p || "_all"}`;
      };

      const isTinyviewPath = (raw) =>
        String(raw || "").trim().startsWith(TINYVIEW_IB_PREFIX);

      const applyTinyviewChrome = () => {
        const hide = (el) => {
          if (el) el.style.display = "none";
        };
        // Hide workspace chrome; keep status / legend / viewport / thin manager bar.
        const pathLabel = pathEl?.closest?.("label");
        hide(pathLabel);
        hide(refreshBtn);
        hide(viewPrefixBtn);
        hide(exportTinyviewBtn);
        hide(exportTinyviewConfirm);
        hide(prefsHost);
        hide(part("prefs"));
        hide(part("hostpark-mirror"));
        hide(managerBar);
        if (legendEl) legendEl.style.display = "none";
      };

      const getBinMediaFromTip = async (ib) => {
        const tip = tipApi();
        const frame = await tip.get(ib);
        if (!frame) return null;
        const binRef = Array.isArray(frame.rel8ns?.bin)
          ? frame.rel8ns.bin[0]
          : null;
        const sha = binShaFromRef(binRef);
        if (!sha) return null;
        const binApi = globalThis.navi?.storage?.bin;
        if (!binApi?.get) return null;
        const bin = await binApi.get(sha);
        if (!bin || bin.media == null) return null;
        return {
          frame,
          media: String(bin.media),
          mime: String(bin.mime || "text/html; charset=utf-8"),
        };
      };

      /** Kit HTML for planting a tinyview (never the tinyview tip itself). */
      const fetchKitHtml = async () => {
        const own = String(root.getAttribute("data-path") || "").trim();
        const candidates = [];
        if (own && !isTinyviewPath(own)) candidates.push(own);
        candidates.push("testkit/tinyviewport", "torus/testkit/tinyviewport");
        for (const ib of candidates) {
          try {
            const hit = await getBinMediaFromTip(ib);
            if (hit?.media && hit.media.includes('name="tinyviewport"')) {
              return hit.media;
            }
          } catch {
            /* try next */
          }
        }
        // Last resort: live DOM (scripts already evaluated; still usable as shell)
        return root.outerHTML;
      };

      /** Rewrite only the tinyviewport root tag â€” never scan the whole HTML (script literals contain data-path= patterns). */
      const rewriteDataPath = (html, ib) => {
        const s = String(html || "");
        const path = String(ib || "").trim();
        const openRe = /<div\b[^>]*\bname="tinyviewport"[^>]*>/i;
        const m = openRe.exec(s);
        if (!m) {
          return s.replace(
            /name="tinyviewport"/,
            `name="tinyviewport" data-path="${path}"`
          );
        }
        const tag = m[0];
        const newTag = /\bdata-path="/i.test(tag)
          ? tag.replace(/\bdata-path="[^"]*"/i, `data-path="${path}"`)
          : tag.replace(/>$/, ` data-path="${path}">`);
        return s.slice(0, m.index) + newTag + s.slice(m.index + tag.length);
      };

      const enabledPluginIds = async () => {
        const mgr = getManager();
        if (!mgr?.listPlugins) return [];
        const ids = [];
        for (const p of mgr.listPlugins()) {
          if (await mgr.isPluginEnabled(p.id)) ids.push(p.id);
        }
        return ids;
      };

      const seedManagerFromTinyview = async (manifest) => {
        const mgr = getManager();
        if (!mgr) return;
        const plugins = Array.isArray(manifest.plugins) ? manifest.plugins : [];
        for (const id of plugins) {
          try {
            await mgr.setPluginEnabled(id, true);
          } catch {
            /* ignore */
          }
        }
        const viewKey = String(manifest.viewKey || "").trim();
        const offsets =
          manifest.offsets && typeof manifest.offsets === "object"
            ? manifest.offsets
            : {};
        if (viewKey && typeof mgr.loadPrefs === "function") {
          try {
            const prefs = await mgr.loadPrefs();
            const viewOffsets = { ...(prefs.viewOffsets || {}) };
            viewOffsets[viewKey] = { ...offsets };
            if (typeof mgr.savePrefs === "function") {
              await mgr.savePrefs(
                { ...prefs, viewOffsets },
                { silent: true }
              );
            }
          } catch {
            /* ignore */
          }
        }
        const snap = manifest.prefs && typeof manifest.prefs === "object"
          ? manifest.prefs
          : null;
        if (snap) {
          applyPrefs({ ...prefsState, ...snap });
          try {
            if (typeof mgr.patchPrefs === "function") {
              await mgr.patchPrefs(fragmentToMgrPatch(prefsState));
            }
          } catch {
            /* ignore */
          }
        }
      };

      const tryLoadTinyviewManifest = async () => {
        const path = String(root.getAttribute("data-path") || "").trim();
        if (!isTinyviewPath(path)) return null;
        try {
          const frame = await tipApi().get(path);
          const d = frame?.data;
          if (!d || d.kind !== "tinyview") return null;
          return { ...d, _ib: path };
        } catch {
          return null;
        }
      };

      const enterTinyviewMode = async (manifest) => {
        tinyviewMode = true;
        tinyviewManifest = manifest;
        applyTinyviewChrome();
        await seedManagerFromTinyview(manifest);
        const prefix = normalizePrefix(manifest.prefix || "");
        if (pathEl) pathEl.value = prefix;
        state.prefix = prefix;
        renderManagerBar();
        await renderLegend();
        await refresh();
        await openPrefixView();
        setStatus(
          `tinyview ${manifest._ib || tinyviewIbForPrefix(prefix)}` +
            (prefix ? ` Â· ${prefix}` : " Â· all tips") +
            ` Â· ${state.prefixGraph?.nodes?.size || 0} node(s)`
        );
      };

      const plantTinyview = async () => {
        if (!state.prefixViewOpen || !state.prefixGraph) {
          throw new Error("open a prefix view first");
        }
        const tip = tipApi();
        const binApi = globalThis.navi?.storage?.bin;
        if (!binApi?.putMedia || !binApi?.ref) {
          throw new Error("navi.storage.bin.putMedia unavailable");
        }
        const prefix = normalizePrefix(state.prefix || pathEl?.value || "");
        const ib = tinyviewIbForPrefix(prefix);
        const mgr = getManager();
        let viewKey = String(state.prefixGraph.viewKey || "").trim();
        if (!viewKey && mgr?.buildViewKey) {
          viewKey = await mgr.buildViewKey({
            prefixView: true,
            scope: prefix || "*",
          });
          if ((state.prefixGraph.layout || []).length) {
            viewKey = `${viewKey}${layoutRevSuffix(state.prefixGraph.layout)}`;
          }
        }
        let offsets = {};
        if (viewKey && mgr?.getViewOffsets) {
          offsets = (await mgr.getViewOffsets(viewKey)) || {};
        }
        const plugins = await enabledPluginIds();
        const prefs = currentPrefsSnapshot();
        const exportedAt = new Date().toISOString();
        const manifest = {
          kind: "tinyview",
          version: 1,
          prefix,
          mode: "mass",
          plugins,
          viewKey,
          offsets,
          prefs,
          exportedAt,
        };
        let html = await fetchKitHtml();
        html = rewriteDataPath(html, ib);
        const sha = await binApi.putMedia({
          media: html,
          mime: "text/html; charset=utf-8",
        });
        const ref = binApi.ref(sha);
        const data = {
          ...manifest,
          parts: ["htmf", "ibgib_frame", "manifest", "json"],
          park: "defer",
          default_method: "GET",
          content_type: "text/html; charset=utf-8",
          path: ib,
          http: {
            GET: { kind: "bin" },
            POST: { kind: "bin" },
            PUT: { kind: "commit" },
            DELETE: { kind: "tombstone" },
          },
          about: {
            label: prefix ? `tinyview ${prefix}` : "tinyview (all)",
            description: `Exported tinyviewport prefix view (${plugins.join(",") || "no plugins"})`,
          },
        };
        const existing = await tip.get(ib);
        if (existing?.data && typeof tip.mut8 === "function") {
          await tip.mut8(ib, data, { rel8ns: { bin: [ref] } });
        } else {
          await tip.set({
            ib,
            gib: "",
            data,
            rel8ns: { bin: [ref], past: [], tjp: [], dna: [] },
          });
        }
        return { ib, html };
      };

      /** Replace this HTMF with the planted tinyview (htmx outerHTML swap). */
      const swapRootToTinyview = async (ib, htmlFallback) => {
        const navi = globalThis.navi;
        const htmxApi = globalThis.htmx;
        let url = `/${String(ib || "").replace(/^\/+/, "")}`;
        if (typeof navi?.resolveUrl === "function") {
          try {
            const u = navi.resolveUrl(ib);
            if (typeof u === "string" && u) url = u;
            else if (u && typeof u.href === "string") url = u.href;
          } catch {
            /* keep */
          }
        }
        url = encodeURI(url);

        if (htmxApi && typeof htmxApi.ajax === "function") {
          await new Promise((resolve, reject) => {
            let settled = false;
            let timer = null;
            const done = (err) => {
              if (settled) return;
              settled = true;
              if (timer) clearTimeout(timer);
              document.removeEventListener("htmx:afterSwap", onAfter);
              document.removeEventListener("htmx:afterSettle", onAfter);
              document.removeEventListener("htmx:responseError", onErr);
              document.removeEventListener("htmx:swapError", onErr);
              if (err) reject(err);
              else resolve();
            };
            const onAfter = () => {
              if (!document.contains(root)) done();
            };
            const onErr = (ev) => {
              done(
                new Error(
                  ev?.detail?.error || `htmx swap failed for ${ib}`
                )
              );
            };
            document.addEventListener("htmx:afterSwap", onAfter);
            document.addEventListener("htmx:afterSettle", onAfter);
            document.addEventListener("htmx:responseError", onErr);
            document.addEventListener("htmx:swapError", onErr);
            try {
              htmxApi.ajax("GET", url, {
                target: root,
                swap: "outerHTML",
              });
            } catch (err) {
              done(err);
              return;
            }
            timer = setTimeout(() => {
              if (!document.contains(root)) done();
              else done(new Error(`htmx swap timeout for ${ib}`));
            }, 8000);
          });
          return;
        }

        // Fallback without htmx: inject planted HTML + re-run scripts
        const html = String(htmlFallback || "").trim();
        if (!html) throw new Error("htmx unavailable and no html fallback");
        const wrap = document.createElement("div");
        wrap.innerHTML = html;
        const next =
          wrap.querySelector('div[name="tinyviewport"]') ||
          wrap.firstElementChild;
        if (!next) throw new Error("planted html missing tinyviewport root");
        root.replaceWith(next);
        next.querySelectorAll("script").forEach((oldScript) => {
          const script = document.createElement("script");
          for (const attr of oldScript.attributes) {
            script.setAttribute(attr.name, attr.value);
          }
          script.textContent = oldScript.textContent;
          oldScript.replaceWith(script);
        });
        if (htmxApi && typeof htmxApi.process === "function") {
          htmxApi.process(next);
        }
      };

      const splitAddr = (addr) => {
        const a = String(addr || "");
        const i = a.indexOf("^");
        if (i <= 0) return { ib: a, gib: "" };
        return { ib: a.slice(0, i), gib: a.slice(i + 1) };
      };

      const frameAddr = (frame) => {
        if (!frame || !frame.ib) return "";
        return frame.gib ? `${frame.ib}^${frame.gib}` : String(frame.ib);
      };

      const shortAddr = (addr) => {
        const a = String(addr || "");
        const caret = a.indexOf("^");
        if (caret < 0) return a.length > 28 ? a.slice(0, 28) + "â€¦" : a;
        return `${a.slice(0, caret)}^${a.slice(caret + 1, caret + 9)}â€¦`;
      };

      const looksLikeAddr = (s) => {
        const t = String(s || "").trim();
        const i = t.indexOf("^");
        return i > 0 && i < t.length - 1;
      };

      const HOSTPARK_STATUS_FADE_MS = 15000;
      const HOSTPARK_STATUS_FADE_DURATION_MS = 500;
      let hostparkStatusFadeTimer = null;

      const clearHostparkStatusFade = () => {
        if (hostparkStatusFadeTimer) {
          clearTimeout(hostparkStatusFadeTimer);
          hostparkStatusFadeTimer = null;
        }
        if (hostparkStatusEl) {
          hostparkStatusEl.style.opacity = "";
        }
      };

      const setHostparkStatus = (text, opts = {}) => {
        if (!hostparkStatusEl) return;
        clearHostparkStatusFade();
        hostparkStatusEl.textContent = text || "";
        const fadeAfter = Number(opts.fadeAfterMs);
        if (text && fadeAfter > 0) {
          hostparkStatusFadeTimer = setTimeout(() => {
            hostparkStatusEl.style.opacity = "0";
            hostparkStatusFadeTimer = setTimeout(() => {
              hostparkStatusEl.textContent = "";
              hostparkStatusEl.style.opacity = "";
              hostparkStatusFadeTimer = null;
            }, HOSTPARK_STATUS_FADE_DURATION_MS);
          }, fadeAfter);
        }
      };

      const mirrorStatusFade = { fadeAfterMs: HOSTPARK_STATUS_FADE_MS };

      const theme = () => ({
        border: prefsState.border || DEFAULT_PREFS.border,
        hostpark: prefsState.hostpark || DEFAULT_PREFS.hostpark,
        text: prefsState.text || DEFAULT_PREFS.text,
        bg: prefsState.bg || DEFAULT_PREFS.bg,
        nodeFill: prefsState.nodeFill || DEFAULT_PREFS.nodeFill,
        nodeText: prefsState.nodeText || DEFAULT_PREFS.nodeText,
        nodeStroke: prefsState.nodeStroke || DEFAULT_PREFS.nodeStroke,
      });

      const clampScale = (v) => {
        const n = Number(v);
        if (!Number.isFinite(n)) return DEFAULT_PREFS.scale;
        return Math.max(0, Math.min(200, Math.round(n)));
      };

      const getScalePct = () =>
        liveScalePct != null
          ? clampScale(liveScalePct)
          : clampScale(prefsState.scale);

      const scaleMetrics = () => {
        const s = getScalePct() / 100;
        const sq = Math.max(6, Math.round(SQ * s));
        const gap = Math.max(2, Math.round(GAP * s));
        const rowH = Math.max(sq + 4, Math.round(ROW_H * s));
        const fontPx = Math.max(7, Math.round(10 * s));
        return { s, sq, gap, rowH, fontPx, pct: getScalePct() };
      };

      /** Parse frame/node wall time â†’ epoch ms (or null). */
      const parseStampMs = (raw) => {
        if (raw == null || raw === "") return null;
        if (typeof raw === "number" && Number.isFinite(raw)) {
          return raw > 1e12 ? raw : raw * 1000;
        }
        const s = String(raw).trim();
        if (!s) return null;
        const t = Date.parse(s);
        return Number.isFinite(t) ? t : null;
      };

      const nodeStampMs = (node) => {
        const d = node?.frame?.data;
        if (!d || typeof d !== "object") return null;
        return (
          parseStampMs(d.timestamp) ??
          parseStampMs(d.stamp?.timestamp) ??
          parseStampMs(d.at) ??
          parseStampMs(d.created_at) ??
          parseStampMs(d.mutated_at)
        );
      };

      /**
       * Unique sorted timestamps from nodes in the open view's lineages.
       * @returns {{ bumps: number[], min: number, max: number }|null}
       */
      const collectTimeline = (graph) => {
        if (!graph?.nodes?.size) return null;
        const set = new Set();
        for (const node of graph.nodes.values()) {
          const ms = nodeStampMs(node);
          if (ms != null) set.add(ms);
        }
        if (set.size < 1) return null;
        const bumps = [...set].sort((a, b) => a - b);
        return { bumps, min: bumps[0], max: bumps[bumps.length - 1] };
      };

      const snapTimelineMs = (ms, bumps, thresholdRatio = 0.02) => {
        if (!bumps?.length || !Number.isFinite(ms)) return ms;
        const span = Math.max(1, bumps[bumps.length - 1] - bumps[0]);
        const thresh = Math.max(1, span * thresholdRatio);
        let best = bumps[0];
        let bestD = Math.abs(ms - best);
        for (const b of bumps) {
          const d = Math.abs(ms - b);
          if (d < bestD) {
            best = b;
            bestD = d;
          }
        }
        return bestD <= thresh ? best : ms;
      };

      const formatTimelineLabel = (ms) => {
        if (!Number.isFinite(ms)) return "â€”";
        try {
          const d = new Date(ms);
          if (Number.isNaN(d.getTime())) return "â€”";
          return d.toLocaleString(undefined, {
            month: "short",
            day: "numeric",
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
          });
        } catch {
          return "â€”";
        }
      };

      const normalizeTimelineAt = (raw) => {
        if (raw == null || raw === "") return null;
        const ms = parseStampMs(raw);
        if (ms == null) return null;
        try {
          return new Date(ms).toISOString();
        } catch {
          return null;
        }
      };

      const getTimelineMs = (timeline) => {
        if (liveTimelineMs != null && Number.isFinite(liveTimelineMs)) {
          return liveTimelineMs;
        }
        const fromPrefs = parseStampMs(prefsState.timelineAt);
        if (fromPrefs != null) return fromPrefs;
        return timeline?.max ?? null;
      };

      const timelineScrubActive = async () => {
        const mgr = getManager();
        if (!mgr?.isPluginEnabled) return false;
        try {
          const [lin, flow] = await Promise.all([
            mgr.isPluginEnabled("lineage"),
            mgr.isPluginEnabled("flowchart"),
          ]);
          return !!lin && !!flow;
        } catch {
          return false;
        }
      };

      /** Dim nodes / edges after the scrub stamp; highlight nodes on the snap. */
      const applyTimelineScrub = (graph, scrubMs) => {
        if (!graph?.nodes || scrubMs == null || !Number.isFinite(scrubMs)) {
          for (const node of graph?.nodes?.values?.() || []) {
            node._timelineDim = false;
            node._timelineHit = false;
            node._timelineMs = nodeStampMs(node);
          }
          return;
        }
        const near = 750; // ms window counts as "on" this bump
        for (const node of graph.nodes.values()) {
          const ms = nodeStampMs(node);
          node._timelineMs = ms;
          if (ms == null) {
            node._timelineDim = false;
            node._timelineHit = false;
            continue;
          }
          node._timelineDim = ms > scrubMs + near;
          node._timelineHit = Math.abs(ms - scrubMs) <= near;
        }
      };

      const applyPrefs = (prefs) => {
        const p = { ...DEFAULT_PREFS, ...(prefs || {}) };
        p.scale = clampScale(p.scale);
        p.timelineAt = normalizeTimelineAt(p.timelineAt);
        prefsState = { ...p };
        root.style.setProperty("--tv-border", p.border);
        root.style.setProperty("--tv-hostpark", p.hostpark);
        root.style.setProperty("--tv-text", p.text);
        root.style.setProperty("--tv-bg", p.bg);
        root.style.setProperty("--tv-node-fill", p.nodeFill);
        root.style.setProperty("--tv-node-text", p.nodeText);
        root.style.setProperty("--tv-node-stroke", p.nodeStroke);
        const b = borderEl();
        const h = hostparkEl();
        const t = textEl();
        const g = bgEl();
        const nf = nodeFillEl();
        const nt = nodeTextEl();
        const ns = nodeStrokeEl();
        const po = previewOverlayEl();
        const nest = nestingEl();
        if (b) b.value = p.border;
        if (h) h.value = p.hostpark;
        if (t) t.value = p.text;
        if (g) g.value = p.bg;
        if (nf) nf.value = p.nodeFill;
        if (nt) nt.value = p.nodeText;
        if (ns) ns.value = p.nodeStroke;
        if (po) {
          po.checked =
            p.previewOverlay !== undefined
              ? !!p.previewOverlay
              : DEFAULT_PREFS.previewOverlay;
        }
        if (nest) nest.checked = !!p.nesting;
      };

      const mgrPrefsToFragment = (mp) => {
        const n = mp?.node && typeof mp.node === "object" ? mp.node : {};
        return {
          border: mp.border || DEFAULT_PREFS.border,
          hostpark: mp.hostpark || DEFAULT_PREFS.hostpark,
          text: mp.text || DEFAULT_PREFS.text,
          bg: mp.bg || DEFAULT_PREFS.bg,
          nodeFill: n.fill || DEFAULT_PREFS.nodeFill,
          nodeText: n.text || DEFAULT_PREFS.nodeText,
          nodeStroke: n.stroke || DEFAULT_PREFS.nodeStroke,
          previewOverlay:
            mp.previewOverlay !== undefined
              ? !!mp.previewOverlay
              : DEFAULT_PREFS.previewOverlay,
          nesting: !!mp.nesting,
          scale: clampScale(
            mp.scale !== undefined ? mp.scale : DEFAULT_PREFS.scale
          ),
          timelineAt: normalizeTimelineAt(
            mp.timelineAt !== undefined ? mp.timelineAt : DEFAULT_PREFS.timelineAt
          ),
        };
      };

      const fragmentToMgrPatch = (prefs) => {
        const stroke = prefs.nodeStroke || DEFAULT_PREFS.nodeStroke;
        return {
          border: prefs.border,
          hostpark: prefs.hostpark,
          text: prefs.text,
          bg: prefs.bg,
          previewOverlay: !!prefs.previewOverlay,
          nesting: !!prefs.nesting,
          scale: clampScale(prefs.scale),
          timelineAt: normalizeTimelineAt(prefs.timelineAt),
          node: {
            fill: prefs.nodeFill,
            text: prefs.nodeText,
            stroke,
            strokeTip: stroke,
            strokeCascade: stroke,
            strokeOrphan: stroke,
            strokeStub: stroke,
          },
        };
      };

      const loadPrefs = async () => {
        const mgr = getManager();
        if (mgr && typeof mgr.loadPrefs === "function") {
          try {
            const mp = await mgr.loadPrefs();
            applyPrefs(mgrPrefsToFragment(mp || {}));
            return prefsState;
          } catch (err) {
            setStatus(String(err?.message || err));
          }
        }
        // No manager: fragment-local fallback store
        let merged = { ...DEFAULT_PREFS };
        try {
          const raw = await itemApi().get(PREFS_KEY);
          if (raw && typeof raw === "object") {
            merged = { ...merged, ...raw };
          }
        } catch {
          /* default */
        }
        applyPrefs(merged);
        return prefsState;
      };

      const nestingOn = () => {
        const n = nestingEl();
        return n ? !!n.checked : !!prefsState.nesting;
      };

      const previewOverlayOn = () => {
        const po = previewOverlayEl();
        return po ? !!po.checked : !!prefsState.previewOverlay;
      };

      const currentPrefsSnapshot = () => ({
        border: borderEl()?.value || prefsState.border || DEFAULT_PREFS.border,
        hostpark:
          hostparkEl()?.value || prefsState.hostpark || DEFAULT_PREFS.hostpark,
        text: textEl()?.value || prefsState.text || DEFAULT_PREFS.text,
        bg: bgEl()?.value || prefsState.bg || DEFAULT_PREFS.bg,
        nodeFill:
          nodeFillEl()?.value || prefsState.nodeFill || DEFAULT_PREFS.nodeFill,
        nodeText:
          nodeTextEl()?.value || prefsState.nodeText || DEFAULT_PREFS.nodeText,
        nodeStroke:
          nodeStrokeEl()?.value ||
          prefsState.nodeStroke ||
          DEFAULT_PREFS.nodeStroke,
        previewOverlay: previewOverlayOn(),
        nesting: nestingOn(),
        scale: getScalePct(),
        timelineAt: normalizeTimelineAt(
          liveTimelineMs != null ? liveTimelineMs : prefsState.timelineAt
        ),
      });

      const savePrefs = async (patch = {}) => {
        const prefs = { ...currentPrefsSnapshot(), ...patch };
        prefs.scale = clampScale(prefs.scale);
        prefs.timelineAt = normalizeTimelineAt(prefs.timelineAt);
        liveScalePct = null;
        liveTimelineMs = null;
        applyPrefs(prefs);
        try {
          const mgr = getManager();
          if (mgr && typeof mgr.patchPrefs === "function") {
            await mgr.patchPrefs(fragmentToMgrPatch(prefs));
          } else {
          await itemApi().set(PREFS_KEY, prefs);
          }
          setStatus("prefs saved");
        } catch (err) {
          setStatus(String(err?.message || err));
        }
      };

      /**
       * Only tips mirrored through this fragment's hostpark pipe are tinted.
       * No frame-shape heuristic (park / network_proposal) â€” host does not stamp origin.
       */
      const isHostparkMirroredIb = (ibOrAddr) => {
        const ib = String(ibOrAddr || "").includes("^")
          ? splitAddr(ibOrAddr).ib
          : String(ibOrAddr || "").trim();
        return !!ib && hostparkMirrorIbs.has(ib);
      };

      const loadHostparkMirrorIndex = async () => {
        try {
          const raw = await itemApi().get(HOSTPARK_MIRROR_KEY);
          const list = Array.isArray(raw?.ibs)
            ? raw.ibs
            : Array.isArray(raw)
              ? raw
              : [];
          hostparkMirrorIbs = new Set(
            list.map((x) => String(x || "").trim()).filter(Boolean)
          );
        } catch {
          hostparkMirrorIbs = new Set();
        }
      };

      const rememberHostparkMirrors = async (ibs) => {
        let changed = false;
        for (const ib of ibs) {
          const key = String(ib || "").trim();
          if (!key || hostparkMirrorIbs.has(key)) continue;
          hostparkMirrorIbs.add(key);
          changed = true;
        }
        if (!changed) return;
        try {
          await itemApi().set(HOSTPARK_MIRROR_KEY, {
            ibs: [...hostparkMirrorIbs].sort((a, b) => a.localeCompare(b)),
          });
        } catch (err) {
          setHostparkStatus(
            `mirrored ok but index save failed: ${err?.message || err}`,
            mirrorStatusFade
          );
        }
      };

      const isCascadeFrame = (frame) => {
        if (!frame || typeof frame !== "object") return false;
        if (String(frame?.data?.source || "") === "cascade") return true;
        const c = frame?.rel8ns?.cascade_of;
        return Array.isArray(c) && c.length > 0;
      };

      const hasHtml = (frame) =>
        frame && frame.data?.html != null && String(frame.data.html) !== "";

      /** Read a frame from tip.frame space, live tip, or legacy embeds/items. */
      const framesMapGet = (map, addr) => {
        if (!map || typeof map !== "object") return null;
        const a = String(addr || "").trim();
        if (!a) return null;
        if (map[a] && typeof map[a] === "object") return map[a];
        const want = a.toUpperCase();
        for (const [k, v] of Object.entries(map)) {
          if (String(k).toUpperCase() === want && v && typeof v === "object") {
            return v;
          }
        }
        return null;
      };

      const getFrame = async (addr) => {
        const a = String(addr || "").trim();
        if (!a) return null;
        const { ib, gib } = splitAddr(a);
        try {
          const f = await tipApi().frame?.get?.(a);
          if (f && typeof f === "object") return f;
        } catch {
          /* ignore */
        }
        try {
          const tip = await tipApi().get(ib);
          if (tip && typeof tip === "object") {
            if (
              gib &&
              String(tip.gib || "").toUpperCase() === gib.toUpperCase()
            ) {
              return tip;
            }
            const fromMap = framesMapGet(tip.data?.frames, a);
            if (fromMap) return fromMap;
            if (!gib) return tip;
          }
        } catch {
          /* ignore */
        }
        try {
          const f = await itemApi().get(FRAME_PREFIX + a);
          if (f && typeof f === "object") return f;
        } catch {
          /* ignore */
        }
        return null;
      };

      /** Latest tip addr from navi.storage.tip (ignore legacy item tip keys). */
      const getTipAddr = async (ib) => {
        const key = String(ib || "").trim();
        if (!key) return null;
        try {
          const tip = await tipApi().get(key);
          if (tip && typeof tip === "object") return frameAddr(tip) || null;
          if (typeof tip === "string" && tip.includes("^")) return tip;
        } catch {
          /* ignore */
        }
        return null;
      };

      /**
       * Same lineage walk snoopy history uses: tip â†’ past via tip.frame.get.
       * Also merges tip.frame.list so missing past links still show every gen.
       */
      const loadTipSpine = async (ib) => {
        const key = String(ib || "").trim();
        const out = new Map(); // addr â†’ frame
        let tip = null;
        try {
          tip = await tipApi().get(key);
        } catch {
          tip = null;
        }
        if (!tip || typeof tip !== "object") {
          return { tip: null, tipAddr: null, frames: out };
        }
        const tipAddr = frameAddr(tip);
        if (tipAddr) out.set(tipAddr, tip);

        // All generations in frame space (authoritative when present)
        try {
          const listed = ((await tipApi().frame?.list?.(key)) || []).map(String);
          for (const addr of listed) {
            if (!addr || out.has(addr)) continue;
            const f = await getFrame(addr);
            if (f) out.set(addr, f);
          }
        } catch {
          /* list optional */
        }

        // Walk past from tip (same as snoopy history)
        let cur = tip;
        let guard = 0;
        while (cur && guard++ < 64) {
          const past =
            Array.isArray(cur.rel8ns?.past) && cur.rel8ns.past[0]
              ? String(cur.rel8ns.past[0])
              : "";
          if (!past || out.has(past)) break;
          const f = await getFrame(past);
          if (!f) break;
          out.set(past, f);
          cur = f;
        }

        // Chain position from the past walk (oldest = 0); no stored counter.
        const chain = [];
        for (let f = tip, g = 0; f && g < 512; g++) {
          const a = g === 0 ? tipAddr : frameAddr(f);
          if (!a || chain.includes(a)) break;
          chain.push(a);
          const past =
            Array.isArray(f.rel8ns?.past) && f.rel8ns.past[0]
              ? String(f.rel8ns.past[0])
              : "";
          f = past ? out.get(past) : null;
        }
        chain.reverse();
        const seq = new Map(chain.map((a, i) => [a, i]));

        return { tip, tipAddr, frames: out, seq };
      };

      /**
       * Build graph for an ib: unique nodes by addr + edges from real rel8ns.
       * Reads tip/frame item keys (+ navi tip store) â€” no module API.
       */
      const loadGraph = async (ib) => {
        const base = String(ib || "").trim();
        const nodes = new Map();
        const edges = [];
        const edgeKey = new Set();
        let spineSeq = new Map();
        const stampOf = (a) => {
          const t = Date.parse(nodes.get(a)?.frame?.data?.timestamp);
          return Number.isFinite(t) ? t : Number.POSITIVE_INFINITY;
        };
        const byOrder = (a, b) => {
          const sa = spineSeq.get(a);
          const sb = spineSeq.get(b);
          if (sa != null && sb != null) return sa - sb;
          const ta = stampOf(a);
          const tb = stampOf(b);
          if (ta !== tb) return ta - tb;
          return String(a).localeCompare(String(b));
        };

        const addNode = (addr, patch = {}) => {
          const a = String(addr || "").trim();
          if (!a) return null;
          const prev = nodes.get(a) || {
            addr: a,
            ib: splitAddr(a).ib,
            frame: null,
            stub: true,
            kind: "frame",
            seq: null,
            row: "main",
          };
          const next = { ...prev, ...patch, addr: a };
          if (spineSeq.has(a)) next.seq = spineSeq.get(a);
          if (next.frame) {
            next.stub = false;
            next.ib = String(next.frame.ib || next.ib || splitAddr(a).ib);
            if (isCascadeFrame(next.frame)) next.kind = "cascade";
          }
          nodes.set(a, next);
          return next;
        };

        const addEdge = (from, to, rel) => {
          const f = String(from || "").trim();
          const t = String(to || "").trim();
          if (!f || !t || f === t) return;
          const k = `${f}|${t}|${rel}`;
          if (edgeKey.has(k)) return;
          edgeKey.add(k);
          let color = EDGE.other;
          const r = String(rel || "");
          if (r === "past") color = EDGE.past;
          else if (
            r === "cascade_of" ||
            r === "mutation_of" ||
            r === "htmf_ibgib"
          ) {
            color = EDGE.cascade;
          }
          edges.push({ from: f, to: t, rel: r, color });
          addNode(f);
          addNode(t);
        };

        const collectRelEdges = (addr, frame) => {
          if (!frame?.rel8ns || typeof frame.rel8ns !== "object") return;
          for (const [rel, vals] of Object.entries(frame.rel8ns)) {
            if (rel === "bin" || rel === "dna" || rel === "tjp") continue;
            const list = Array.isArray(vals) ? vals : [];
            for (const v of list) {
              if (looksLikeAddr(v)) addEdge(addr, String(v), rel);
            }
          }
          const htmf = frame?.data?.htmf_ibgib;
          if (htmf && looksLikeAddr(htmf)) {
            addEdge(addr, String(htmf), "htmf_ibgib");
          }
        };

        const walkLineage = async (startAddr, rowKey, kindDefault) => {
          const addrs = [];
          const seen = new Set();
          let addr = String(startAddr || "").trim();
          let guard = 0;
          while (addr && !seen.has(addr) && guard++ < 64) {
            seen.add(addr);
            const frame = await getFrame(addr);
            const cascade = frame ? isCascadeFrame(frame) : false;
            addNode(addr, {
              frame,
              stub: !frame,
              kind: cascade ? "cascade" : kindDefault,
              row: rowKey,
            });
            if (frame) collectRelEdges(addr, frame);
            addrs.push(addr);
            if (!frame) break;
            const past = Array.isArray(frame.rel8ns?.past)
              ? frame.rel8ns.past.map(String)
              : [];
            addr = past[0] || "";
          }
          // Edges come only from real rel8ns (collectRelEdges) â€” do not
          // invent past between neighbors after a prune.
          return addrs;
        };

        /** Ensure tip.data.frames embeds appear as main-row squares (legacy). */
        const mergeEmbeddedFrames = async (tipAddr, rowKey) => {
          const tipFrame = await getFrame(tipAddr);
          const map = tipFrame?.data?.frames;
          if (!map || typeof map !== "object") return [];
          const extra = [];
          for (const [rawAddr, frame] of Object.entries(map)) {
            const addr = String(rawAddr || "").trim();
            if (!addr || !frame || typeof frame !== "object") continue;
            if (!nodes.has(addr) || nodes.get(addr).stub) {
              addNode(addr, {
                frame,
                stub: false,
                kind: isCascadeFrame(frame) ? "cascade" : "main",
                row: rowKey,
              });
              collectRelEdges(addr, frame);
              extra.push(addr);
            }
          }
          return extra;
        };

        /**
         * Load every tip.frame generation for this ib (real ib^gib records).
         * Rebuilds the n-spine even when past links are missing/dangling.
         */
        const mergeTipFrameStore = async (ib, tipAddr, rowKey) => {
          const listFn = tipApi().frame?.list;
          if (typeof listFn !== "function") return [];
          let addrs = [];
          try {
            addrs = ((await listFn(ib)) || []).map(String);
          } catch {
            return [];
          }
          if (tipAddr && !addrs.includes(tipAddr)) addrs.push(tipAddr);
          const extra = [];
          for (const addr of addrs) {
            const frame = await getFrame(addr);
            if (!frame) continue;
            addNode(addr, {
              frame,
              stub: false,
              kind: isCascadeFrame(frame) ? "cascade" : "main",
              row: rowKey,
            });
            collectRelEdges(addr, frame);
            extra.push(addr);
          }
          return extra;
        };

        const orderSpineByN = (addrs) => {
          const uniq = [...new Set(addrs.map(String).filter(Boolean))];
          return uniq.sort(byOrder);
        };

        let directAddrs = [];
        let frameStoreCount = 0;
        const spine = await loadTipSpine(base);
        // Only this ib's tip + frames â€” child ibs (base:â€¦) are separate list
        // entries and get their own expand, not nested under the parent.
        if (spine.tipAddr) {
          frameStoreCount = spine.frames.size;
          spineSeq = spine.seq;
          const spineStamp = (a) => {
            const t = Date.parse(spine.frames.get(a)?.data?.timestamp);
            return Number.isFinite(t) ? t : Number.POSITIVE_INFINITY;
          };
          const addrs = [...spine.frames.keys()].sort((a, b) => {
            const sa = spineSeq.get(a);
            const sb = spineSeq.get(b);
            if (sa != null && sb != null) return sa - sb;
            const ta = spineStamp(a);
            const tb = spineStamp(b);
            if (ta !== tb) return ta - tb;
            return String(a).localeCompare(String(b));
          });
          for (const addr of addrs) {
            const frame = spine.frames.get(addr);
            addNode(addr, {
              frame,
              stub: false,
              kind:
                addr === spine.tipAddr
                  ? "tip"
                  : isCascadeFrame(frame)
                    ? "cascade"
                    : "main",
              row: "main",
            });
            if (frame) collectRelEdges(addr, frame);
          }
