          directAddrs = addrs;
          const tipNode = nodes.get(spine.tipAddr);
          if (tipNode) tipNode.kind = "tip";
        }

        const frameKeys = ((await tipApi().frame?.list?.()) || []).map(String);
        for (const addr of frameKeys) {
          const ibOf = splitAddr(addr).ib;
          if (ibOf !== base) continue;
          if (nodes.has(addr) && !nodes.get(addr).stub) continue;
          const frame = await getFrame(addr);
          if (!frame) continue;
          addNode(addr, {
            frame,
            stub: false,
            kind: isCascadeFrame(frame) ? "cascade" : "frame",
            row: isCascadeFrame(frame) ? "orphan" : "main",
          });
          collectRelEdges(addr, frame);
        }

        // Resolve stubs that only appear as edge targets
        for (const [addr, node] of [...nodes.entries()]) {
          if (!node.stub && node.frame) continue;
          const f = await getFrame(addr);
          if (f) {
            addNode(addr, { frame: f, stub: false });
            collectRelEdges(addr, f);
          }
        }

        if (directAddrs.length) {
          const tipA = directAddrs[directAddrs.length - 1];
          const n = nodes.get(tipA);
          if (n) n.kind = "tip";
        }

        // Never draw unresolved "?" stubs â€” only real frames.
        for (const [addr, node] of [...nodes.entries()]) {
          if (node.stub || !node.frame) nodes.delete(addr);
        }
        for (let i = edges.length - 1; i >= 0; i--) {
          const e = edges[i];
          if (!nodes.has(e.from) || !nodes.has(e.to)) edges.splice(i, 1);
        }
        // Keep main spine addrs that still have nodes
        directAddrs = directAddrs.filter((a) => nodes.has(a));

        const byN = byOrder;

        /**
         * Same-ib frames that no longer share a live past edge are separate
         * lineage heads (prune in the middle splits the chain).
         */
        const lineageComponents = (addrs) => {
          const set = new Set(addrs);
          const adj = new Map();
          for (const a of addrs) adj.set(a, new Set());
          for (const e of edges) {
            if (e.rel !== "past") continue;
            if (!set.has(e.from) || !set.has(e.to)) continue;
            adj.get(e.from).add(e.to);
            adj.get(e.to).add(e.from);
          }
          const seen = new Set();
          const comps = [];
          for (const start of addrs.slice().sort(byN)) {
            if (seen.has(start)) continue;
            const stack = [start];
            const comp = [];
            seen.add(start);
            while (stack.length) {
              const x = stack.pop();
              comp.push(x);
              for (const y of adj.get(x) || []) {
                if (seen.has(y)) continue;
                seen.add(y);
                stack.push(y);
              }
            }
            comp.sort(byN);
            comps.push(comp);
          }
          comps.sort((a, b) => byN(a[0], b[0]));
          return comps;
        };

        const sameIb = [...nodes.values()]
          .filter((n) => String(n.ib || "") === base)
          .map((n) => n.addr);
        const lineages = lineageComponents(sameIb);
        lineages.forEach((line, i) => {
          const rowKey = i === 0 ? "main" : `lineage:${i}`;
          for (const a of line) {
            const n = nodes.get(a);
            if (n) n.row = rowKey;
          }
        });
        if (lineages[0]) directAddrs = lineages[0];

        return {
          base,
          nodes,
          edges,
          directAddrs,
          lineages,
          leafTips: [],
          frameStoreCount,
        };
      };

      const dismissFloat = () => {
        if (floatEl) {
          try {
            floatEl.remove();
          } catch {
            /* ignore */
          }
          floatEl = null;
        }
        floatAddr = null;
        viewport
          .querySelectorAll("[data-tv-selected='1']")
          .forEach((el) => {
            el.dataset.tvSelected = "0";
            el.style.outline = "";
          });
      };

      const pruneFrame = async (addr, node) => {
        const tip = tipApi();
        if (typeof tip.frame?.del !== "function") {
          throw new Error("navi.storage.tip.frame.del unavailable");
        }
        const a = String(addr || "").trim();
        if (!a || !a.includes("^")) {
          throw new Error("prune needs a full ib^gib addr");
        }
        const { ib } = splitAddr(a);
        const frame = node?.frame && typeof node.frame === "object"
          ? node.frame
          : await getFrame(a);
        let currentTip = null;
        try {
          currentTip = await tip.get(ib);
        } catch {
          currentTip = null;
        }
        const currentTipAddr = currentTip ? frameAddr(currentTip) : null;
        const wasTip = !currentTipAddr || currentTipAddr === a;

        await tip.frame.del(a);
        try {
          const item = itemApi();
          if (typeof item.del === "function") {
            await item.del(FRAME_PREFIX + a);
          }
        } catch {
          /* legacy item key optional */
        }

        const remaining = ((await tip.frame.list?.(ib)) || [])
          .map(String)
          .filter((x) => x && x !== a);

        if (wasTip) {
          if (!remaining.length) {
            if (typeof tip.del === "function") await tip.del(ib);
          } else {
            const past0 =
              Array.isArray(frame?.rel8ns?.past) && frame.rel8ns.past[0]
                ? String(frame.rel8ns.past[0])
                : "";
            let nextFrame = null;
            if (past0 && remaining.includes(past0)) {
              nextFrame = await getFrame(past0);
            }
            if (!nextFrame) {
              const ranked = [];
              for (const ra of remaining) {
                const f = await getFrame(ra);
                if (f) ranked.push(f);
              }
              ranked.sort((x, y) => {
                const tx = Date.parse(x?.data?.timestamp) || 0;
                const ty = Date.parse(y?.data?.timestamp) || 0;
                if (tx !== ty) return ty - tx;
                return frameAddr(y).localeCompare(frameAddr(x));
              });
              nextFrame = ranked[0] || null;
            }
            if (nextFrame && typeof tip.set === "function") {
              await tip.set(nextFrame);
            }
          }
        }
      };

      /** Every frame (ib^gib) in frame space at this ib, plus the tip pointer. */
      const listFramesAtIb = async (ib) => {
        const tip = tipApi();
        const addrs = new Set(
          ((await tip.frame?.list?.(ib)) || []).map(String).filter(Boolean)
        );
        try {
          const cur = await tip.get(ib);
          const a = cur ? frameAddr(cur) : null;
          if (a) addrs.add(a);
        } catch {
          /* no tip */
        }
        return [...addrs].filter((a) => splitAddr(a).ib === ib);
      };

      /** Drop every frame at ib and the tip itself. Bins are left alone (same as prune). */
      const pruneAllAtIb = async (ib) => {
        const tip = tipApi();
        if (typeof tip.frame?.del !== "function") {
          throw new Error("navi.storage.tip.frame.del unavailable");
        }
        const target = String(ib || "").trim();
        if (!target) throw new Error("prune all needs an ib");
        const addrs = await listFramesAtIb(target);
        const item = itemApi();
        let dropped = 0;
        for (const a of addrs) {
          try {
            await tip.frame.del(a);
            dropped++;
          } catch (err) {
            console.warn("[tinyviewport] prune all: frame.del failed", a, err);
          }
          try {
            if (typeof item.del === "function") await item.del(FRAME_PREFIX + a);
          } catch {
            /* legacy item key optional */
          }
        }
        if (typeof tip.del === "function") {
          try {
            await tip.del(target);
          } catch {
            /* tip may already be gone */
          }
        }
        return { ib: target, dropped, total: addrs.length };
      };

      const rerenderOpenGraph = async () => {
        if (!state.selectedIb) {
          renderList();
          return;
        }
        setStatus(`loading graph ${state.selectedIb}â€¦`);
        state.graph = await resolveGraph(state.selectedIb);
        await renderLegend();
        renderList();
        const graph = state.graph;
        setStatus(
          `${state.ibs.length} tip(s) Â· open ${state.selectedIb} Â· ${graph.nodes.size} node(s) Â· ${graph.edges.length} edge(s)` +
            (graph.viaManager
              ? ` Â· manager [${(graph.sources || []).join(",")}]`
              : "") +
            (graph.lineages?.length > 1
              ? ` Â· ${graph.lineages.length} lineage lines`
              : "")
        );
      };

      const renderPluginOverlayActions = async (
        hostEl,
        node,
        frame,
        ui = {}
      ) => {
        const mgr = getManager();
        if (!hostEl || !mgr?.resolveNodeOverlay) return;
        let overlay = { actions: [], scrub: null };
        try {
          overlay = await mgr.resolveNodeOverlay(node, frame);
        } catch (err) {
          console.warn("[tinyviewport] resolveNodeOverlay failed", err);
          return;
        }
        const items = Array.isArray(overlay?.actions) ? overlay.actions : [];
        const scrub = overlay?.scrub;

        const isLaunchNode =
          node?.flowKind === "launch" ||
          node?.flowBand === "launch" ||
          node?.layoutBand === "launch" ||
          /:launch$/i.test(String(node?.row || ""));
        if (
          isLaunchNode &&
          !items.some((a) => String(a?.id || "") === "open_boot")
        ) {
          const ib = String(node?.ib || frame?.ib || "")
            .trim()
            .replace(/^\/+/, "");
          if (ib) {
            const naviApi = globalThis.navi;

            if (!url) {

              url = origin ? `${origin}/${ib}` : `/${ib}`;
            }
            const openBoot = () => {
              if (typeof globalThis.open === "function") {
                globalThis.open(url, "_blank", "noopener,noreferrer");
              }
            };
            items.push({
              id: "open_boot",
              label: "open boot",
              title: `Open ${ib} in a new tab`,
              href: url,
              run: openBoot,
            });
          }
        }

        hostEl.replaceChildren();
        if (!items.length && !scrub) {
          hostEl.style.display = "none";
          return;
        }
        hostEl.style.display = "flex";
        hostEl.style.flexDirection = "column";
        hostEl.style.alignItems = "stretch";
        hostEl.style.gap = "6px";

        if (scrub && typeof scrub.step === "function") {
          const scrubRow = document.createElement("div");
          scrubRow.style.cssText =
            "display:flex;align-items:center;gap:6px;flex-wrap:wrap";
          const label = document.createElement("span");
          label.textContent = String(scrub.label || "lineage");
          scrubRow.appendChild(label);
          const prevBtn = document.createElement("button");
          prevBtn.type = "button";
          prevBtn.textContent = "â€¹";
          const nextBtn = document.createElement("button");
          nextBtn.type = "button";
          nextBtn.textContent = "â€º";
          const idxEl = document.createElement("span");
          const range = document.createElement("input");
          range.type = "range";
          range.min = "0";
          range.max = String(Math.max(0, Number(scrub.total) - 1));
          range.value = String(
            Math.max(
              0,
              Math.min(
                Number(scrub.index) || 0,
                Math.max(0, Number(scrub.total) - 1)
              )
            )
          );
          const applyScrub = async (index) => {
            const i = Math.max(
              0,
              Math.min(Number(index) || 0, Number(range.max))
            );
            range.value = String(i);
            idxEl.textContent = `${i + 1}/${Number(scrub.total) || 1}`;
            let hit = scrub.step(i);
            if (hit && typeof hit.then === "function") hit = await hit;
            if (!hit) return;
            const fr = hit.frame || frame;
            if (ui.tipEl && fr) {
              try {
                ui.tipEl.textContent = JSON.stringify(fr, null, 2);
              } catch {
                ui.tipEl.textContent = String(fr);
              }
            }
            if (ui.detailEl && hit.detail) {
              ui.detailEl.textContent = String(hit.detail);
              ui.detailEl.style.display = "block";
            }
          };
          prevBtn.addEventListener("click", (ev) => {
            ev.preventDefault();
            ev.stopPropagation();
            void applyScrub(Number(range.value) - 1);
          });
          nextBtn.addEventListener("click", (ev) => {
            ev.preventDefault();
            ev.stopPropagation();
            void applyScrub(Number(range.value) + 1);
          });
          range.addEventListener("input", (ev) => {
            ev.stopPropagation();
            void applyScrub(Number(range.value));
          });
          scrubRow.appendChild(prevBtn);
          scrubRow.appendChild(range);
          scrubRow.appendChild(nextBtn);
          scrubRow.appendChild(idxEl);
          hostEl.appendChild(scrubRow);
          const detailEl = document.createElement("div");
          detailEl.style.cssText = "font-size:11px;opacity:0.85";
          detailEl.style.display = "none";
          hostEl.appendChild(detailEl);
          if (ui) ui.detailEl = detailEl;
          void applyScrub(range.value);
        }

        const actionRow = document.createElement("div");
        actionRow.style.cssText =
          "display:flex;align-items:center;gap:8px;flex-wrap:wrap";
        for (const a of items) {
          const label = String(a?.label || a?.id || "action");
          const href = a?.href != null ? String(a.href).trim() : "";
          if (href) {
            const link = document.createElement("a");
            link.href = href;
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.textContent = label;
            if (a.title) link.title = String(a.title);
            link.style.cssText = "font:inherit;cursor:pointer";
            link.addEventListener("click", (ev) => ev.stopPropagation());
            actionRow.appendChild(link);
            continue;
          }
          if (typeof a?.run !== "function") continue;
          const btn = document.createElement("button");
          btn.type = "button";
          btn.textContent = label;
          if (a.title) btn.title = String(a.title);
          btn.addEventListener("click", (ev) => {
            ev.preventDefault();
            ev.stopPropagation();
            if (typeof a.run !== "function") return;
            void Promise.resolve(a.run()).catch((err) => {
              setStatus(String(err?.message || err));
            });
          });
          actionRow.appendChild(btn);
        }
        if (actionRow.childNodes.length) hostEl.appendChild(actionRow);
      };

      const showFloat = (anchorEl, node, host) => {

        const headText = document.createElement("span");

        if (overlay) {

          "padding-top:14px",
          "border-top:2px solid #333",
          "flex:0 0 auto",
        ].join(";");
        floatEl.appendChild(binHost);

        if (overlay) {
          (shellEl || root).appendChild(floatEl);
        } else {
        const row =
          (host && host.closest && host.closest("[data-part='tip-row']")) ||
          host;
        if (row) row.appendChild(floatEl);
        else host.appendChild(floatEl);
        }

        const primaryMime = (raw) =>
          String(raw || "")
            .split(";")[0]
            .trim()
            .toLowerCase();

        const binPreviewKind = (mime, frame) => {
          let m = primaryMime(mime);
          if (!m) {
            const parts = Array.isArray(frame?.data?.parts)
              ? frame.data.parts.map(String)
              : [];
            if (parts.includes("text")) m = "text/plain";
          }
          if (!m) return null;
          if (m === "application/json" || m.endsWith("+json")) return "text";
          if (m === "text/html" || m.endsWith("+html")) return "html";
          if (m === "text/plain" || m.startsWith("text/")) return "text";
          if (m.startsWith("image/")) return "image";
          if (m.startsWith("video/")) return "video";
          return null;
        };

        /** Build a data:/blob: URL for image|video bin media. */
        const mediaSrcForBinary = (media, mime) => {
          const s = String(media ?? "");
          if (!s) return null;
          if (/^(data:|blob:)/i.test(s)) return s;
          const m = primaryMime(mime) || "application/octet-stream";
          // Common case: base64 payload without data: prefix
          const compact = s.replace(/\s+/g, "");
          if (/^[A-Za-z0-9+/]+=*$/.test(compact) && compact.length > 32) {
            return `data:${m};base64,${compact}`;
          }
          try {
            const bytes = new Uint8Array(s.length);
            for (let i = 0; i < s.length; i++) bytes[i] = s.charCodeAt(i) & 0xff;
            const blob = new Blob([bytes], { type: m });
            return URL.createObjectURL(blob);
          } catch {
            return null;
          }
        };

        /** Payload size: decoded bytes for base64 / data: media, else UTF-8 bytes. */
        const binSizeLabel = (media, kind) => {
          const s = String(media ?? "");
          const stored = utf8Bytes(s);
          const b64Bytes = (b64) => {
            const c = b64.replace(/\s+/g, "");
            const pad = c.endsWith("==") ? 2 : c.endsWith("=") ? 1 : 0;
            return Math.max(0, Math.floor((c.length * 3) / 4) - pad);
          };
          let decoded = stored;
          const dataUrl = s.match(/^data:[^,]*;base64,(.*)$/is);
          if (dataUrl) {
            decoded = b64Bytes(dataUrl[1]);
          } else if (
            (kind === "image" || kind === "video" || kind === null) &&
            /^[A-Za-z0-9+/]+=*$/.test(s.replace(/\s+/g, "")) &&
            s.length > 32
          ) {
            decoded = b64Bytes(s);
          }
          const main = formatSpaceBytes(decoded);
          return decoded !== stored
            ? `${main} (stored ${formatSpaceBytes(stored)})`
            : main;
        };

        void (async () => {
          // Always re-load frame from tip/frame space (graph node may be stale).
          let frame = null;
          try {
            frame = (await getFrame(addr)) || node.frame || null;
          } catch {
            frame = node.frame || null;
          }
          if (!frame) {
            tipEl.textContent =
              "(frame not in tip/frame store â€” stub addr only)";
            tipEl.style.opacity = "0.65";
            await renderPluginOverlayActions(pluginActionsEl, node, null, {
              tipEl,
            });
            return;
          }

          await renderPluginOverlayActions(pluginActionsEl, node, frame, {
            tipEl,
          });

          try {
            tipEl.textContent = JSON.stringify(frame, null, 2);
          } catch {
            tipEl.textContent = String(frame);
          }

          const ref = Array.isArray(frame.rel8ns?.bin)
            ? frame.rel8ns.bin[0]
            : null;
          const sha = String(ref || "")
            .trim()
            .match(/^bin\s+([0-9a-fA-F]+)$/)?.[1]
            ?.toLowerCase();
          if (!sha) return;

          let bin = null;
          try {
            bin = await globalThis.navi?.storage?.bin?.get?.(sha);
          } catch (err) {
            binHost.style.display = "block";
            binHost.textContent = `bin ${sha.slice(0, 12)}â€¦ load failed: ${
              err && err.message ? err.message : err
            }`;
            return;
          }
          if (!bin || bin.media == null) {
            binHost.style.display = "block";
            binHost.textContent = `bin ${sha.slice(0, 12)}â€¦ missing in storage.bin`;
            return;
          }

          const mime =
            primaryMime(bin.mime) ||
            primaryMime(frame.data?.content_type) ||
            primaryMime(frame.data?.contentType) ||
            "";
          const kind = binPreviewKind(mime, frame);
          if (!kind) {
            binHost.style.display = "block";
            binHost.textContent = `bin ${sha.slice(0, 12)}â€¦ Â· ${
              mime || "(no mime)"
            } Â· ${binSizeLabel(bin.media, null)} â€” no preview kind`;
            return;
          }

          const labelRow = document.createElement("div");
          labelRow.style.cssText =
            "display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px";
          const label = document.createElement("span");
          label.style.cssText = "font:700 12px/1.35 monospace";
          label.textContent = `bin ${sha.slice(0, 12)}â€¦ Â· ${mime || kind} Â· ${binSizeLabel(bin.media, kind)}`;
          const showBinBtn = document.createElement("button");
          showBinBtn.type = "button";
          showBinBtn.textContent = "show bin";
          showBinBtn.style.cssText = "cursor:pointer";
          labelRow.appendChild(label);
          labelRow.appendChild(showBinBtn);
          binHost.appendChild(labelRow);

          const payloadEl = document.createElement("div");
          payloadEl.setAttribute("data-part", "preview-bin-payload");
          payloadEl.style.cssText = "white-space:normal;display:none";
          binHost.appendChild(payloadEl);
          binHost.style.display = "block";

          let payloadRendered = false;
          showBinBtn.addEventListener("click", (ev) => {
            ev.preventDefault();
            ev.stopPropagation();
            const open = payloadEl.style.display === "none";
            if (open && !payloadRendered) {
              payloadRendered = true;
              renderBinPayload();
            }
            payloadEl.style.display = open ? "block" : "none";
            showBinBtn.textContent = open ? "hide bin" : "show bin";
          });

          const renderBinPayload = () => {
          if (kind === "text") {
            const pre = document.createElement("pre");
            pre.setAttribute("data-part", "preview-bin-text");
            pre.style.cssText = [
              "display:block",
              "margin:0",
              "padding:10px 12px",
              "width:100%",
              "min-height:4rem",
              "max-height:40rem",
              "overflow:auto",
              "box-sizing:border-box",
              "border:1px solid #bbb",
              "background:#fff",
              "color:#111",
              "font:13px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace",
              "white-space:pre-wrap",
              "word-break:break-word",
            ].join(";");
            let body = String(bin.media);
            if (
              (mime === "application/json" || mime.endsWith("+json")) &&
              body.trim()
            ) {
              try {
                body = JSON.stringify(JSON.parse(body), null, 2);
              } catch {
                /* keep raw */
              }
            }
            pre.textContent = body;
            payloadEl.appendChild(pre);
            return;
          }

          if (kind === "html") {
            const iframe = document.createElement("iframe");
            iframe.setAttribute("sandbox", "");
            iframe.setAttribute("referrerpolicy", "no-referrer");
            iframe.title = "bin html preview (sandboxed)";
            iframe.style.cssText = [
              "display:block",
              "width:100%",
              "min-height:14rem",
              "max-height:40rem",
              "border:1px solid #bbb",
              "background:#fff",
              "box-sizing:border-box",
            ].join(";");
            iframe.srcdoc = String(bin.media);
            payloadEl.appendChild(iframe);
            return;
          }

          const src = mediaSrcForBinary(bin.media, mime);
          if (!src) {
            payloadEl.textContent = "(no previewable media)";
            return;
          }

          if (kind === "image") {
            const img = document.createElement("img");
            img.alt = `bin ${sha.slice(0, 12)}`;
            img.src = src;
            img.style.cssText =
              "display:block;max-width:100%;height:auto;border:1px solid #bbb";
            payloadEl.appendChild(img);
            return;
          }

          if (kind === "video") {
            const video = document.createElement("video");
            video.controls = true;
            video.preload = "metadata";
            video.src = src;
            video.style.cssText =
              "display:block;max-width:100%;max-height:24rem;border:1px solid #bbb";
            payloadEl.appendChild(video);
          }
          };
        })();
      };

      /**
       * Plugin band layout â€” plans come from manager.getLayoutPlan() /
       * collectGraph().layout. Fragment does not know flow (or any plugin).
       * Nodes stamp layoutPrefix + layoutBand (+ layoutOrder); row = `${prefix}:${band}`.
       */
      const layoutOrderOf = (n) => {
        if (n?.layoutOrder != null && Number.isFinite(Number(n.layoutOrder))) {
          return Number(n.layoutOrder);
        }
        // brief compat with flowchart field name
        if (
          n?.flowLayoutOrder != null &&
          Number.isFinite(Number(n.flowLayoutOrder))
        ) {
          return Number(n.flowLayoutOrder);
        }
        return null;
      };

    // Also accept legacy head/core band ids from brief broken builds.
      const layoutBandOf = (n, plan) => {
        const raw = (() => {
          if (
            n?.layoutPrefix === plan.prefix &&
            n?.layoutBand != null &&
            String(n.layoutBand) !== ""
          ) {
            return String(n.layoutBand);
          }
          const row = String(n?.row || "");
          const pref = `${plan.prefix}:`;
          if (row.startsWith(pref)) return row.slice(pref.length);
          if (n?.flowBand && (plan.prefix === "flow" || !n.layoutPrefix)) {
            return String(n.flowBand);
          }
          return "";
        })();
        if (!raw) return "";
        // Map short-lived head/core aliases back onto original bands.
        if (plan.bands.includes(raw)) return raw;
        if (raw === "head") {
          if (plan.bands.includes("launch") || plan.bands.includes("config")) {
            const kind = String(n?.flowKind || "");
            if (kind === "config") return "config";
            if (kind === "launch") return "launch";
            return plan.bands.includes("config") ? "config" : "launch";
          }
        }
        if (raw === "core") {
          if (plan.bands.includes("flow") || plan.bands.includes("modules")) {
            const kind = String(n?.flowKind || "");
            if (kind === "flow") return "flow";
            if (
              kind === "init" ||
              kind === "manager" ||
              kind === "registry" ||
              kind === "module"
            ) {
              return "modules";
            }
            return plan.bands.includes("flow") ? "flow" : "modules";
          }
        }
        return raw;
      };

      const synthesizeLayoutFromNodes = (nodes) => {
        /** @type {Map<string, Map<string, number>>} */
        const byPrefix = new Map();
        for (const n of nodes.values()) {
          let prefix = String(n.layoutPrefix || "").trim();
          let band = String(n.layoutBand || "").trim();
          if ((!prefix || !band) && n.flowBand) {
            prefix = prefix || "flow";
            band = band || String(n.flowBand);
          }
          if ((!prefix || !band) && String(n.row || "").includes(":")) {
            const row = String(n.row);
            if (
              row.startsWith("ib:") ||
              row.startsWith("lineage:") ||
              row.startsWith("foreign")
            ) {
              continue;
            }
            const i = row.indexOf(":");
            prefix = prefix || row.slice(0, i);
            band = band || row.slice(i + 1);
          }
          if (!prefix || !band) continue;
          if (!byPrefix.has(prefix)) byPrefix.set(prefix, new Map());
          const ranks = byPrefix.get(prefix);
          const r = Number(n.layoutBandRank);
          const prev = ranks.has(band) ? ranks.get(band) : Infinity;
          const next = Number.isFinite(r) ? r : 1000;
          ranks.set(band, Math.min(prev, next));
        }
        const plans = [];
        for (const [prefix, ranks] of byPrefix) {
          const bands = [...ranks.keys()].sort((a, b) => {
            const ra = ranks.get(a);
            const rb = ranks.get(b);
            if (ra !== rb) return ra - rb;
            return String(a).localeCompare(String(b));
          });
          plans.push({
            pluginId: prefix,
            prefix,
            bands,
            rev: "synth",
          });
        }
        return plans;
      };

      const ensureGraphLayout = async (graph) => {
        if (!graph || !graph.nodes) return [];
        // Prefer live getLayoutPlan() over graph.layout â€” remount/reindex can
        // change bands while a cached prefixGraph still carries an old plan.
        let plans = [];
        try {
          plans = await resolveLayoutPlans(null);
        } catch {
          plans = [];
        }
        if (!plans.length && Array.isArray(graph.layout) && graph.layout.length) {
          plans = graph.layout;
        }
        if (!plans.length) {
          plans = synthesizeLayoutFromNodes(graph.nodes);
        }
        graph.layout = plans;
        graph.bandLayout = plans.length > 0;
        graph.flowMode = plans.length > 0;
        if (plans.length) inheritLayoutBands(graph.nodes, plans);
        return plans;
      };

      const nodeInLayoutPlan = (n, plans) => {
        if (!plans?.length) return false;
        if (n?.layoutPrefix && n?.layoutBand) return true;
        if (n?.flowBand) return true;
        const row = String(n?.row || "");
        return plans.some((p) => row.startsWith(`${p.prefix}:`));
      };

      /** When a band-layout plugin is on, paste tip layout fields onto same-ib past gens. */
      const inheritLayoutBands = (nodes, plans) => {
        if (!plans?.length) return;
        const byIb = new Map();
        for (const n of nodes.values()) {
          if (!nodeInLayoutPlan(n, plans)) continue;
          const ib = String(n.ib || "").trim();
          if (!ib) continue;
          if (!byIb.has(ib)) {
            byIb.set(ib, {
              layoutPrefix: n.layoutPrefix,
              layoutBand: n.layoutBand,
              layoutBandRank: n.layoutBandRank,
              layoutOrder: n.layoutOrder,
              flowBand: n.flowBand,
              flowKind: n.flowKind,
              flowMeta: n.flowMeta,
              flowLayoutOrder: n.flowLayoutOrder,
              flowRouteOrder: n.flowRouteOrder,
              row: n.row,
            });
          }
        }
        for (const n of nodes.values()) {
          const ib = String(n.ib || "").trim();
          const hit = byIb.get(ib);
          if (!hit) continue;
          if (!n.layoutPrefix && hit.layoutPrefix) n.layoutPrefix = hit.layoutPrefix;
          if (!n.layoutBand && hit.layoutBand) n.layoutBand = hit.layoutBand;
          if (n.layoutBandRank == null && hit.layoutBandRank != null) {
            n.layoutBandRank = hit.layoutBandRank;
          }
          if (n.layoutOrder == null && hit.layoutOrder != null) {
            n.layoutOrder = hit.layoutOrder;
          }
          if (!n.flowBand && hit.flowBand) n.flowBand = hit.flowBand;
          if (!n.flowKind && hit.flowKind) n.flowKind = hit.flowKind;
          if (!n.flowMeta && hit.flowMeta) n.flowMeta = hit.flowMeta;
          if (n.flowLayoutOrder == null && hit.flowLayoutOrder != null) {
            n.flowLayoutOrder = hit.flowLayoutOrder;
          }
          if (n.flowRouteOrder == null && hit.flowRouteOrder != null) {
            n.flowRouteOrder = hit.flowRouteOrder;
          }
          if (hit.layoutPrefix && hit.layoutBand) {
            n.row = `${hit.layoutPrefix}:${hit.layoutBand}`;
          } else if (hit.row && String(hit.row).includes(":")) {
            n.row = hit.row;
          }
        }
      };

      const resolveLayoutPlans = async (graphOrNull) => {
        if (Array.isArray(graphOrNull?.layout) && graphOrNull.layout.length) {
          return graphOrNull.layout;
        }
        const mgr = getManager();
        if (mgr && typeof mgr.getLayoutPlan === "function") {
          try {
            return (await mgr.getLayoutPlan()) || [];
          } catch {
            return [];
          }
        }
        return [];
      };

      const layoutRevSuffix = (plans) => {
        if (!plans?.length) return "";
        return (
          "|L:" +
          plans
            .map((p) => `${p.prefix}.${p.rev || "1"}`)
            .join("+")
        );
      };

      const layoutGraph = (graph) => {
        const rows = [];
        const rowIndex = new Map();
        const ensureRow = (key) => {
          if (rowIndex.has(key)) return rowIndex.get(key);
          const i = rows.length;
          rowIndex.set(key, i);
          rows.push({ key, addrs: [] });
          return i;
        };

        const plans = Array.isArray(graph.layout) ? graph.layout : [];
        const usesBandLayout = plans.length > 0;

        if (usesBandLayout) {
          const placed = new Set();
          for (const plan of plans) {
            const bandRank = (band) => {
              let min = Infinity;
              let found = false;
              for (const n of graph.nodes.values()) {
                if (layoutBandOf(n, plan) !== band) continue;
                const r = Number(n.layoutBandRank);
                if (!Number.isFinite(r)) continue;
                min = Math.min(min, r);
                found = true;
              }
              if (found) return min;
              const idx = (plan.bands || []).indexOf(band);
              return idx >= 0 ? idx : 1000;
            };
            // Node ranks win over plan.bands array order (synth used tip-scan
            // order and put boot above cfg even when the plugin wanted cfg first).
            const bandSet = new Set(plan.bands || []);
            for (const n of graph.nodes.values()) {
              const b = layoutBandOf(n, plan);
              if (b) bandSet.add(b);
            }
            const bands = [...bandSet].sort((a, b) => {
              const ra = bandRank(a);
              const rb = bandRank(b);
              if (ra !== rb) return ra - rb;
              const ia = (plan.bands || []).indexOf(a);
              const ib = (plan.bands || []).indexOf(b);
              if (ia >= 0 && ib >= 0 && ia !== ib) return ia - ib;
              if (ia >= 0 && ib < 0) return -1;
              if (ib >= 0 && ia < 0) return 1;
              return String(a).localeCompare(String(b));
            });
            for (const band of bands) {
              const rk = `${plan.prefix}:${band}`;
              const addrs = [...graph.nodes.values()]
                .filter((n) => layoutBandOf(n, plan) === band)
                .sort((a, b) => {
                  const oa = layoutOrderOf(a);
                  const ob = layoutOrderOf(b);
                  if (oa != null && ob != null && oa !== ob) return oa - ob;
                  if (oa != null && ob == null) return -1;
                  if (ob != null && oa == null) return 1;
                  const iba = String(a?.ib || "");
                  const ibb = String(b?.ib || "");
                  if (iba !== ibb) return iba.localeCompare(ibb);
                  const na = a?.seq;
                  const nb = b?.seq;
                  if (na != null && nb != null && Number(na) !== Number(nb)) {
                    return Number(na) - Number(nb);
                  }
                  if (a?.kind === "tip" && b?.kind !== "tip") return 1;
                  if (b?.kind === "tip" && a?.kind !== "tip") return -1;
                  return String(a.addr).localeCompare(String(b.addr));
                })
                .map((n) => n.addr);
              if (!addrs.length) continue;
              const ri = ensureRow(rk);
              rows[ri].addrs = addrs;
              for (const a of addrs) placed.add(a);
            }
          }
          const orphanBand = [...graph.nodes.values()]
            .filter((n) => !placed.has(n.addr))
            .map((n) => n.addr);
          if (orphanBand.length) {
            const pref = plans[0]?.prefix || "plugin";
            const ri = ensureRow(`${pref}:other`);
            rows[ri].addrs.push(...orphanBand);
          }
        } else {
        ensureRow("main");
        const lineageKeys = [];
        const foreignKeys = [];
        for (const node of graph.nodes.values()) {
          const rk = node.row || "orphan";
          if (
            rk === "main" ||
            String(rk).startsWith("lineage:") ||
            String(rk).startsWith("ib:")
          ) {
            if (!lineageKeys.includes(rk)) lineageKeys.push(rk);
          } else if (rk === "foreign" || String(rk).startsWith("foreign")) {
            if (!foreignKeys.includes(rk)) foreignKeys.push(rk);
          }
        }
        lineageKeys.sort((a, b) => {
          if (a === "main") return -1;
          if (b === "main") return 1;
          return String(a).localeCompare(String(b));
        });
        for (const rk of lineageKeys) {
          const ri = ensureRow(rk);
          rows[ri].addrs = [...graph.nodes.values()]
            .filter((n) => n.row === rk)
            .sort((a, b) => {
              if (a.seq != null && b.seq != null && a.seq !== b.seq) {
                return a.seq - b.seq;
              }
              return String(a.addr).localeCompare(String(b.addr));
            })
            .map((n) => n.addr);
        }
        foreignKeys.sort((a, b) => String(a).localeCompare(String(b)));
        for (const rk of foreignKeys) {
          const ri = ensureRow(rk);
          rows[ri].addrs = [...graph.nodes.values()]
            .filter((n) => n.row === rk)
            .sort((a, b) => String(a.addr).localeCompare(String(b.addr)))
            .map((n) => n.addr);
        }

        const byRow = new Map();
        for (const node of graph.nodes.values()) {
          const rk = node.row || "orphan";
          if (
            rk === "main" ||
            String(rk).startsWith("lineage:") ||
            String(rk).startsWith("ib:") ||
            rk === "foreign" ||
            String(rk).startsWith("foreign")
          ) {
            continue;
          }
          if (!byRow.has(rk)) byRow.set(rk, []);
          byRow.get(rk).push(node.addr);
        }
        const orphanKeys = [...byRow.keys()].sort((a, b) =>
          String(a).localeCompare(String(b))
        );
        for (const rk of orphanKeys) {
          const ri = ensureRow(rk);
          // order by chain position then addr
          const addrs = byRow.get(rk).slice().sort((a, b) => {
            const na = graph.nodes.get(a)?.seq;
            const nb = graph.nodes.get(b)?.seq;
            if (na != null && nb != null) return Number(na) - Number(nb);
            return String(a).localeCompare(String(b));
          });
          rows[ri].addrs = addrs;
        }
        }

        // Assign x,y â€” cell size follows preference-stack node sizes when set
        const { sq, gap, rowH } = scaleMetrics();
        let cellW = sq;
        let cellH = sq;
        for (const n of graph.nodes.values()) {
          if (n.nw) cellW = Math.max(cellW, n.nw);
          if (n.nh) cellH = Math.max(cellH, n.nh);
        }
        const colStep = cellW + gap;
        const rowStep = Math.max(rowH, cellH + gap);
        let maxCols = 1;
        for (const row of rows) {
          maxCols = Math.max(maxCols, row.addrs.length || 1);
          row.addrs.forEach((addr, col) => {
            const n = graph.nodes.get(addr);
            if (!n) return;
            n.col = col;
            n.rowIdx = rowIndex.get(row.key);
            const nw = n.nw || cellW;
            const nh = n.nh || cellH;
            n.x = col * colStep + nw / 2;
            n.y = n.rowIdx * rowStep + nh / 2;
          });
        }
        return {
          rows,
          width: Math.max(120, maxCols * colStep),
          height: Math.max(rowStep, rows.length * rowStep),
          sq,
          gap,
          rowH: rowStep,
          cellW,
          cellH,
        };
      };

      const prepareNodeStyles = async (graph) => {
        const { s, sq } = scaleMetrics();
        const mgr = getManager();
        const t = theme();
        const nodes = [...graph.nodes.values()];
        await Promise.all(
          nodes.map(async (node) => {
            let style = null;
            if (mgr && typeof mgr.resolveNodeStyle === "function") {
              try {
                style = await mgr.resolveNodeStyle(node, node.frame, {
                  fill: t.nodeFill,
                  text: t.nodeText,
                  stroke: t.nodeStroke,
                  opacity: node.stub ? 0.65 : 1,
                });
              } catch {
                style = null;
              }
            }
            node._style = style && typeof style === "object" ? style : null;
            const w = Number(style?.width);
            const h = Number(style?.height);
            node.nw =
              Number.isFinite(w) && w > 0
                ? Math.max(sq, Math.round(w * s))
                : sq;
            node.nh =
              Number.isFinite(h) && h > 0
                ? Math.max(sq, Math.round(h * s))

          })
        );
      };

      const makeGraphPanel = async (graph) => {
        const panel = document.createElement("div");

        await prepareNodeStyles(graph);

        const timeline = scrubOn ? collectTimeline(graph) : null;
        const scrubMs =
          scrubOn && timeline ? getTimelineMs(timeline) : null;
        applyTimelineScrub(graph, scrubMs);
        await ensureGraphLayout(graph);

        const layout = layoutGraph(graph);
        const { sq, fontPx, s } = scaleMetrics();
        const mgr = getManager();

        if (graph.prefixView && (graph.layout || []).length) {
          const planBits = (graph.layout || [])
            .map((p) => `${p.prefix}:${(p.bands || []).join("â†’")}`)
            .join(" | ");
          const rowBits = (layout.rows || []).map((r) => r.key).join(" Â· ");
          const cap = document.createElement("div");

          panel.appendChild(cap);

        // Identical views share a bag: mass/iso scope + enabled plugin set.
        let viewKey = "";
        if (mgr && typeof mgr.buildViewKey === "function") {

            viewKey = await mgr.buildViewKey({
              prefixView: !!graph.prefixView,
              scope: graph.prefixView
                ? String(state.prefix || graph.base || "*").trim() || "*"
                : String(graph.base || state.selectedIb || "?").trim() || "?",
            });
          } catch {
            viewKey = "";
          }
        }
        if (!viewKey) {
          const scope = graph.prefixView
            ? String(state.prefix || graph.base || "*").trim() || "*"
            : String(graph.base || state.selectedIb || "?").trim() || "?";
          const mode = graph.prefixView ? "mass" : "iso";
          viewKey = `${mode}:${scope.replace(/\|/g, "/")}|p:-`;
        }
        if ((graph.layout || []).length) viewKey = `${viewKey}${layoutRevSuffix(graph.layout)}`;
        graph.viewKey = viewKey;

        let offsets = {};
        if (mgr && typeof mgr.getViewOffsets === "function") {
          try {
            offsets = (await mgr.getViewOffsets(viewKey)) || {};
          } catch {
            offsets = {};
          }
        } else if (graph.prefs?.viewOffsets?.[viewKey]) {
          offsets = graph.prefs.viewOffsets[viewKey] || {};
        }

        for (const node of graph.nodes.values()) {
          if (node.x == null) continue;
          node.ox = node.x;
          node.oy = node.y;
          const o = offsets[node.addr] || { dx: 0, dy: 0 };
          node.dx = Number(o.dx) || 0;
          node.dy = Number(o.dy) || 0;
          node.x = node.ox + node.dx;
          node.y = node.oy + node.dy;
        }

        let minX = 0;
        let minY = 0;
        let maxX = layout.width;
        let maxY = layout.height;
        for (const node of graph.nodes.values()) {
          if (node.x == null) continue;
          const hw = (node.nw || sq) / 2;
          const hh = (node.nh || sq) / 2;
          minX = Math.min(minX, node.x - hw, node.ox - hw);
          minY = Math.min(minY, node.y - hh, node.oy - hh);
          maxX = Math.max(maxX, node.x + hw, node.ox + hw);
          maxY = Math.max(maxY, node.y + hh, node.oy + hh);
        }
        const pad = 8;
        const shiftX = minX < 0 ? -minX + pad : pad;
        const shiftY = minY < 0 ? -minY + pad : pad;
        for (const node of graph.nodes.values()) {
          if (node.x == null) continue;
          node.x += shiftX;
          node.y += shiftY;
          node.ox += shiftX;
          node.oy += shiftY;
        }
        const boardW = Math.max(layout.width, maxX + shiftX + pad);
        const boardH = Math.max(layout.height, maxY + shiftY + pad);
        let boundsW = boardW;
        let boundsH = boardH;
        const clampNodePos = (n) => {
          const hw = (n.nw || sq) / 2;
          const hh = (n.nh || sq) / 2;
          const minXpos = hw;
          const minYpos = hh;
          const maxXpos = Math.max(hw, boundsW - hw);
          const maxYpos = Math.max(hh, boundsH - hh);
          n.x = Math.min(maxXpos, Math.max(minXpos, n.x));
          n.y = Math.min(maxYpos, Math.max(minYpos, n.y));
          n.dx = n.x - n.ox;
          n.dy = n.y - n.oy;
        };
        for (const node of graph.nodes.values()) {
          if (node.x == null) continue;
          clampNodePos(node);
        }

        noteHtmfWidth(boundsW);

        const board = document.createElement("div");
        board.setAttribute("data-part", "graph-board");
        board.style.cssText = [
          `position:relative`,
          `width:${boundsW}px`,
          `height:${boundsH}px`,
          "overflow:hidden",
          "flex:0 0 auto",
        ].join(";");

        let boardHost = panel;

        const syncBoardToPanel = () => {
          const pad = 16;
          const pw = Math.max(0, (boardHost?.clientWidth || panel.clientWidth) - pad);
          // Grow width to the panel; do NOT stretch height â€” that left a huge
          // empty region and made a correct top-down band layout look "bottomed".
          const nextW = Math.max(boardW, pw);
          const nextH = boardH;
          if (nextW === boundsW && nextH === boundsH) return;
          boundsW = nextW;
          boundsH = nextH;
          board.style.width = `${boundsW}px`;
          board.style.height = `${boundsH}px`;
          svg.setAttribute("width", String(boundsW));
          svg.setAttribute("height", String(boundsH));
          noteHtmfWidth(boundsW);
        };

        const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        svg.setAttribute("width", String(boundsW));
        svg.setAttribute("height", String(boundsH));
        svg.style.cssText =
          "position:absolute;left:0;top:0;overflow:visible;pointer-events:none";

        const edgeLines = [];
        const edgesByAddr = new Map();
        const addEdgeRef = (addr, line) => {
          if (!edgesByAddr.has(addr)) edgesByAddr.set(addr, []);
          edgesByAddr.get(addr).push(line);
        };
        const buildEdges = () => {
          while (svg.firstChild) svg.removeChild(svg.firstChild);
          edgeLines.length = 0;
          edgesByAddr.clear();
        for (const e of graph.edges) {
          const a = graph.nodes.get(e.from);
          const b = graph.nodes.get(e.to);
          if (!a || !b || a.x == null || b.x == null) continue;
          const line = document.createElementNS(
            "http://www.w3.org/2000/svg",
            "line"
          );
          line.setAttribute("x1", String(a.x));
          line.setAttribute("y1", String(a.y));
          line.setAttribute("x2", String(b.x));
          line.setAttribute("y2", String(b.y));
            line.setAttribute("stroke", e.color || EDGE.other);
          line.setAttribute("stroke-width", "2");
            const dimEdge = !!(a._timelineDim || b._timelineDim);
            line.setAttribute("opacity", dimEdge ? "0.18" : "0.85");
            if (e.dash) line.setAttribute("stroke-dasharray", String(e.dash));
          line.setAttribute("data-rel", e.rel);
            if (e.source) line.setAttribute("data-source", e.source);
            line.setAttribute("data-from", e.from);
            line.setAttribute("data-to", e.to);
          svg.appendChild(line);
            edgeLines.push({ line, from: e.from, to: e.to });
            addEdgeRef(e.from, line);
            addEdgeRef(e.to, line);
          }
        };
        let edgeRaf = 0;
        const updateEdgesForNode = (addr) => {
          if (edgeRaf) return;
          edgeRaf = requestAnimationFrame(() => {
            edgeRaf = 0;
            const node = graph.nodes.get(addr);
            if (!node || node.x == null) return;
            for (const line of edgesByAddr.get(addr) || []) {
              const from = line.getAttribute("data-from");
              const to = line.getAttribute("data-to");
              const a = graph.nodes.get(from);
              const b = graph.nodes.get(to);
              if (!a || !b) continue;
              line.setAttribute("x1", String(a.x));
              line.setAttribute("y1", String(a.y));
              line.setAttribute("x2", String(b.x));
              line.setAttribute("y2", String(b.y));
            }
          });
        };
        const redrawEdges = () => buildEdges();
        buildEdges();
        board.appendChild(svg);

        const hoverCard = document.createElement("div");
        hoverCard.setAttribute("data-part", "node-flair-detail");
        hoverCard.style.cssText = [
          "display:none",
          "position:absolute",
          "z-index:40",
          "pointer-events:none",
          "min-width:10rem",
          "max-width:18rem",
          "padding:0.55rem 0.65rem",
          "border:2px solid #333",
          "background:#fff",
          "color:#111",
          "box-shadow:0 4px 14px rgba(0,0,0,0.18)",
          "font:12px/1.35 ui-monospace,monospace",
          "box-sizing:border-box",
        ].join(";");
        board.appendChild(hoverCard);

        const hideHoverCard = () => {
          hoverCard.style.display = "none";
          hoverCard.replaceChildren();
        };

        const showHoverCard = (btn, node, style) => {
          const d = style?.detail;
          if (!d && !style?.flair && !style?.label) {
            hideHoverCard();
            return;
          }
          hoverCard.replaceChildren();
          const flairGlyph = d?.flair || style?.flair || "";
          if (flairGlyph) {
            const big = document.createElement("div");
            big.style.cssText = [

          if (d?.kind || style?.label) {
            const kindEl = document.createElement("div");

            kindEl.textContent = d?.kind || "node";
            hoverCard.appendChild(kindEl);
          }
          const head = document.createElement("div");
          head.style.cssText = "font-weight:600;margin-bottom:4px;word-break:break-word";
          head.textContent = d?.heading || style?.title || style?.label || node.addr;
          hoverCard.appendChild(head);
          for (const line of d?.lines || []) {
            const row = document.createElement("div");
            row.style.cssText =
              "opacity:0.9;font-size:11px;word-break:break-all;margin-top:2px";
            row.textContent = String(line);
            hoverCard.appendChild(row);
          }
          if (node._timelineMs != null) {
            const tsRow = document.createElement("div");
            tsRow.style.cssText =
              "opacity:0.9;font-size:11px;margin-top:4px;font-variant-numeric:tabular-nums";
            tsRow.textContent = formatTimelineLabel(node._timelineMs);
            hoverCard.appendChild(tsRow);
          }
          if (style?.fill) hoverCard.style.background = style.fill;
          if (style?.text) hoverCard.style.color = style.text;
          if (style?.stroke) hoverCard.style.borderColor = style.stroke;

          const nw = node.nw || sq;
          const nh = node.nh || sq;
          let left = node.x + nw / 2 + 8;
          let top = node.y - nh / 2;
          hoverCard.style.display = "block";
          // measure after show
          const cardW = hoverCard.offsetWidth || 160;
          const cardH = hoverCard.offsetHeight || 80;
          if (left + cardW > boundsW - 4) left = node.x - nw / 2 - cardW - 8;
          if (left < 4) left = 4;
          if (top + cardH > boundsH - 4) top = Math.max(4, boundsH - cardH - 4);
          if (top < 4) top = 4;
          hoverCard.style.left = `${left}px`;
          hoverCard.style.top = `${top}px`;
        };

        const t = theme();
        const nodeEls = new Map();

        const applyBtnPos = (btn, node) => {
          const nw = node.nw || sq;
          const nh = node.nh || sq;
          btn.style.left = `${node.x - nw / 2}px`;
          btn.style.top = `${node.y - nh / 2}px`;
          btn.style.width = `${nw}px`;
          btn.style.height = `${nh}px`;
        };

        const paintNodeFace = (btn, style, node) => {
          const nw = node.nw || sq;
          const nh = node.nh || sq;
          const faceFont = Math.max(8, Math.round(fontPx * (style?.label ? 0.95 : 1)));
          const flairFont = Math.max(10, Math.round(14 * s));
          btn.replaceChildren();
          btn.style.display = "flex";
          btn.style.flexDirection = "column";
          btn.style.alignItems = "center";
          btn.style.justifyContent = "center";
          btn.style.gap = "1px";
          btn.style.padding = "2px";
          if (style?.flair) {
            const flair = document.createElement("span");
            flair.textContent = style.flair;
            flair.style.cssText = [
              `font:${flairFont}px/1 ui-monospace,monospace`,
              `color:${style.flairColor || style.text || t.nodeText}`,

            btn.appendChild(flair);

          const lab = document.createElement("span");
          lab.style.cssText = [
            "display:block",
            "line-height:1.1",
            `font:${faceFont}px/1.1 ui-monospace,monospace`,
            "white-space:pre-wrap",
            "overflow:hidden",
            "text-align:center",
            `max-height:${Math.max(12, nh - (style?.flair ? flairFont + 4 : 4))}px`,
            "width:100%",
            "pointer-events:none",
          ].join(";");
          lab.textContent =
            style?.label != null
              ? String(style.label)
              : node.seq != null
              ? String(node.seq)
              : node.stub
                ? "?"
                : "Â·";
          btn.appendChild(lab);
        };

        const applyNodeStyle = (btn, style, node) => {
          if (!style) {
            paintNodeFace(btn, null, node);
            return;
          }
          if (style.stroke) btn.style.borderColor = style.stroke;
          if (style.fill) btn.style.background = style.fill;
          if (style.text) btn.style.color = style.text;
          let op = style.opacity != null ? Number(style.opacity) : 1;
          if (node._timelineDim) op = Math.min(op, 0.18);
          else if (node.stub) op = Math.min(op, 0.65);
          btn.style.opacity = String(op);
          if (node._timelineHit) {
            btn.style.outline = `2px solid ${t.hostpark || "#8e44ad"}`;
            btn.style.outlineOffset = "2px";
            btn.style.boxShadow = `0 0 0 1px ${t.bg || "#fff"}, 0 0 6px ${t.hostpark || "#8e44ad"}`;
          } else {
            btn.style.outline = "";
            btn.style.outlineOffset = "";
            btn.style.boxShadow = "";
          }
          if (style.title) btn.title = String(style.title);
          paintNodeFace(btn, style, node);
          applyBtnPos(btn, node);
          if (isHostparkMirroredIb(node.ib || node.addr)) {
            btn.style.borderColor = t.hostpark || EDGE.hostpark;
          }
        };

        for (const node of graph.nodes.values()) {
          if (node.ox == null) continue;
          const nw = node.nw || sq;
          const nh = node.nh || sq;
          const style = node._style;

          const btn = document.createElement("button");
          btn.type = "button";
          btn.dataset.tvAddr = node.addr;
          btn.title = `${node.addr}${node.seq != null ? ` #${node.seq}` : ""}${
            node._timelineMs != null
              ? ` Â· ${formatTimelineLabel(node._timelineMs)}`
              : ""
          } (drag to move)`;

          let borderC = t.nodeStroke;
          let fillC = t.nodeFill;
          let textC = t.nodeText;
          if (isHostparkMirroredIb(node.ib || node.addr)) {
            borderC = t.hostpark || EDGE.hostpark;
          }

          btn.style.cssText = [
            "position:absolute",
            `left:${node.x - nw / 2}px`,
            `top:${node.y - nh / 2}px`,
            `width:${nw}px`,
            `height:${nh}px`,
            "padding:2px",
            "box-sizing:border-box",
            `font:${fontPx}px/1 ui-monospace,monospace`,
            "cursor:grab",
            `border:2px solid ${borderC}`,
            `color:${textC}`,
            `background:${fillC}`,
            node.stub ? "opacity:0.65;font-style:italic" : "",
            "touch-action:none",
            "user-select:none",
            "overflow:hidden",
            "display:flex",
            "flex-direction:column",
            "align-items:center",
            "justify-content:center",
            "z-index:2",
          ].join(";");

          applyNodeStyle(btn, style, node);

          btn.addEventListener("pointerenter", () => {
            if (style?.detail || style?.flair || style?.label) {
              showHoverCard(btn, node, style);
            }
          });
          btn.addEventListener("pointerleave", () => {
            hideHoverCard();
          });

          let drag = null;
          btn.addEventListener("pointerdown", (ev) => {
            if (ev.button !== 0) return;
            hideHoverCard();
            drag = {
              pid: ev.pointerId,
              startX: ev.clientX,
              startY: ev.clientY,
              origDx: node.dx || 0,
              origDy: node.dy || 0,
              moved: false,
            };
            try {
              btn.setPointerCapture(ev.pointerId);
            } catch {
              /* ignore */
            }
            btn.style.cursor = "grabbing";
            ev.preventDefault();
          });
          btn.addEventListener("pointermove", (ev) => {
            if (!drag || ev.pointerId !== drag.pid) return;
            const ddx = ev.clientX - drag.startX;
            const ddy = ev.clientY - drag.startY;
            if (Math.abs(ddx) + Math.abs(ddy) > 3) drag.moved = true;
            if (!drag.moved) return;
            node.dx = drag.origDx + ddx;
            node.dy = drag.origDy + ddy;
            node.x = node.ox + node.dx;
            node.y = node.oy + node.dy;
            clampNodePos(node);
            applyBtnPos(btn, node);
            updateEdgesForNode(node.addr);
          });
          const endDrag = (ev) => {
            if (!drag || ev.pointerId !== drag.pid) return;
            const wasDrag = drag.moved;
            const pid = drag.pid;
            drag = null;
            btn.style.cursor = "grab";
            try {
              btn.releasePointerCapture(pid);
            } catch {
              /* ignore */
            }
            if (wasDrag) {
              if (mgr && typeof mgr.setNodeOffset === "function") {
                void mgr.setNodeOffset(
                  node.addr,
                  { dx: node.dx, dy: node.dy },
                  { viewKey }
                );
              }
            } else {
              showFloat(btn, node, panel);
            }
          };
          btn.addEventListener("pointerup", endDrag);
          btn.addEventListener("pointercancel", endDrag);

          nodeEls.set(node.addr, btn);
          board.appendChild(btn);
        }

        const useTinyviewLegend =
          tinyviewMode && graph.prefixView;
        if (useTinyviewLegend) {
          const graphRow = document.createElement("div");
          graphRow.setAttribute("data-part", "tinyview-graph-row");
          graphRow.style.cssText =
            "display:flex;align-items:flex-start;gap:12px;flex-wrap:nowrap;width:100%;min-width:0;box-sizing:border-box;";
          const boardCol = document.createElement("div");
          boardCol.setAttribute("data-part", "tinyview-graph-board-col");
          boardCol.style.cssText =
            "flex:1 1 auto;min-width:0;position:relative;";
          boardCol.appendChild(board);
          boardHost = boardCol;
          const legendCol = document.createElement("div");
          legendCol.setAttribute("data-part", "tinyview-legend");
          legendCol.style.cssText =
            "flex:0 0 auto;max-width:12rem;min-width:8.5rem;font:10px/1.35 monospace;align-self:flex-start;padding:4px 0 0 0;";
          await appendLegendContent(legendCol, { compact: true, showNote: false });
          graphRow.appendChild(boardCol);
          graphRow.appendChild(legendCol);
          panel.appendChild(graphRow);
        } else {
        panel.appendChild(board);
        }
        requestAnimationFrame(() => {
          syncBoardToPanel();
          if (typeof ResizeObserver === "function") {
            const ro = new ResizeObserver(() => syncBoardToPanel());
            ro.observe(boardHost);
          }
        });
        return panel;
      };

      const openPrefixView = async () => {
        try {
          setStatus(
            `building prefix viewport (${state.ibs.length} tip(s))â€¦`
          );
          state.prefixGraph = await collectPrefixGraph(state.ibs);
          state.prefixViewOpen = true;
          // collapse single-tip dropdown so the prefix board is the focus
          state.selectedIb = null;
          state.graph = null;
          await renderLegend();
          renderList();
          const g = state.prefixGraph;
          setStatus(
            `prefix view Â· ${state.ibs.length} tip(s)` +
              (state.prefix ? ` Â· filter ${state.prefix}` : " Â· entire index") +
              ` Â· ${g.nodes.size} node(s) Â· ${g.edges.length} edge(s)` +
              (g.viaManager
                ? ` Â· manager [${(g.sources || []).join(",")}]`
                : "")
          );
        } catch (err) {
          state.prefixViewOpen = false;
          state.prefixGraph = null;
          renderList();
          setStatus(String(err?.message || err));
        }
      };

      const togglePrefixView = async () => {
        if (state.prefixViewOpen) {
          state.prefixViewOpen = false;
          state.prefixGraph = null;
          renderList();
          setStatus(
            `${state.ibs.length} tip(s)` +
              (state.prefix ? ` Â· filter ${state.prefix}` : "")
          );
          return;
        }
        await openPrefixView();
      };

      let listRenderSeq = 0;

      const nestingEnabled = () => nestingOn();

      /** Split keeping real delimiters between segments. */
      const segmentIbPartsLocal = (ib) => {
        const s = String(ib || "");
        const parts = [];
        const re = /[:/\s]+|%20/gi;
        let last = 0;
        let m;
        while ((m = re.exec(s))) {
          const seg = s.slice(last, m.index).trim();
          if (seg) parts.push({ seg, delimAfter: m[0] });
          else if (parts.length) parts[parts.length - 1].delimAfter += m[0];
          last = m.index + m[0].length;
        }
        const tail = s.slice(last).trim();
        if (tail) parts.push({ seg: tail, delimAfter: "" });
        return parts;
      };

      const collapseUnaryFoldersLocal = (node) => {
        if (!node || !(node.children instanceof Map)) return;
        for (const child of node.children.values()) {
          collapseUnaryFoldersLocal(child);
        }
        while (!node.tipIb && node.children.size === 1 && node.segment) {
          const only = [...node.children.values()][0];
          const delim = only.leadDelim != null ? only.leadDelim : ":";
          node.segment = `${node.segment}${delim}${only.segment}`;
          node.path = only.path;
          node.tipIb = only.tipIb;
          node.children = only.children;
        }
      };

      const ibUnderPrefixLocal = (ib, prefix) => {
        const p = String(prefix || "").trim();
        const s = String(ib || "").trim();
        if (!p) return true;
        if (!s) return false;
        if (s.length < p.length) return false;
        if (s.slice(0, p.length).toLowerCase() !== p.toLowerCase()) return false;
        if (s.length === p.length) return true;
        return /^([:/\s]+|%20)/i.test(s.slice(p.length));
      };

      const stripPrefixFromIbLocal = (ib, prefix) => {
        const p = String(prefix || "").trim();
        const s = String(ib || "").trim();
        if (!p || !s || !ibUnderPrefixLocal(s, p)) return s;
        if (s.length === p.length) return "";
        const rest = s.slice(p.length);
        const m = rest.match(/^([:/\s]+|%20)([\s\S]*)$/i);
        if (m) return m[2];
        return s;
      };

      const foldIbsLocal = (ibs) => {
        const mgr = getManager();
        const stripPrefix = normalizePrefix(state.prefix || "");

        const root = {
          segment: "",
          path: "",
          tipIb: null,
          children: new Map(),

        for (const raw of ibs || []) {
          const tipIb = String(raw || "").trim();

          const forSegs = stripPrefix

          const parts = segmentIbPartsLocal(forSegs || "");
          if (!parts.length) {

            if (!root.children.has(seg)) {

                segment: seg,
                path: seg,
                tipIb: null,
                leadDelim: "",
                children: new Map(),
              });

            root.children.get(seg).tipIb = tipIb;

          let node = root;

          for (let i = 0; i < parts.length; i++) {

          setStatus(
            `${ibs.length} tip(s)` +
              (state.spaceBytesLabel ? ` Â· ${state.spaceBytesLabel}` : "") +
              (state.selectedIb ? ` Â· open ${state.selectedIb}` : "") +
              (state.prefixViewOpen ? " Â· prefix view" : "") +
              (prefix ? ` Â· filter ${prefix}` : "")
          );
        } catch (err) {
          setStatus(String(err?.message || err));
          viewport.textContent = "";
          state.ibs = [];
          state.selectedIb = null;
          state.graph = null;
          state.prefixViewOpen = false;
          state.prefixGraph = null;
          state.spaceBytes = null;
          state.spaceBytesLabel = "";
        }
      };

      refreshBtn?.addEventListener("click", () => {
        void refresh();
      });
      viewPrefixBtn?.addEventListener("click", () => {
        void togglePrefixView();
      });
      exportTinyviewBtn?.addEventListener("click", () => {
        if (!state.prefixViewOpen) {
          setStatus("open a prefix view first, then export-tinyview");
          return;
        }
        if (exportTinyviewBtn) exportTinyviewBtn.style.display = "none";
        if (exportTinyviewConfirm) {
          exportTinyviewConfirm.style.display = "inline-flex";
        }
      });
      exportTinyviewYes?.addEventListener("click", () => {
        void (async () => {
          if (exportTinyviewYes) exportTinyviewYes.disabled = true;
          try {
            setStatus("exporting tinyviewâ€¦");
            const planted = await plantTinyview();
            setStatus(`exported ${planted.ib} â€” swappingâ€¦`);
            if (typeof globalThis.navi?.callout === "function") {
              globalThis.navi.callout(`[tinyviewport] planted ${planted.ib}`);
            }
            await swapRootToTinyview(planted.ib, planted.html);
          } catch (err) {
            setStatus(String(err?.message || err));
            if (exportTinyviewYes) exportTinyviewYes.disabled = false;
            if (exportTinyviewConfirm) {
              exportTinyviewConfirm.style.display = "none";
            }
            if (exportTinyviewBtn && !tinyviewMode) {
              exportTinyviewBtn.style.display = "";
            }
          }
        })();
      });
      hostparkMirrorBtn?.addEventListener("click", () => {
        void runHostparkMirror();
      });
      pathEl?.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          void refresh();
        }
      });
      // Prefs inputs are bound via prefs-host change delegation (mountPrefsHost).

      viewport.addEventListener("click", (e) => {
        if (!floatEl) return;
        const t = e.target;
        if (t && typeof t.closest === "function" && t.closest("[data-part='preview']"))
          return;
        if (t && typeof t.closest === "function" && t.closest("button[data-tv-addr]"))
          return;
        dismissFloat();
      });
      (shellEl || root).addEventListener("click", (e) => {
        if (!floatEl || floatEl.dataset.tvPreviewMode !== "overlay") return;
        const t = e.target;
        if (t && typeof t.closest === "function" && t.closest("[data-part='preview']"))
          return;
        if (t && typeof t.closest === "function" && t.closest("button[data-tv-addr]"))
          return;
        dismissFloat();
      });

      void loadPrefs()
        .then(() => loadHostparkMirrorIndex())
        .then(async () => {
          wireManager();
          renderManagerBar();
          void checkManagerUpdate();
          await mountPrefsHost();
          const manifest = await tryLoadTinyviewManifest();
          if (manifest) {
            try {
              await enterTinyviewMode(manifest);
            } catch (err) {
              setStatus(String(err?.message || err));
              await renderLegend();
              await refresh();
            }
            return;
          }
          await renderLegend();
          await refresh();
        })
        .catch((err) => {
          const msg = String(err?.message || err);
          setStatus(msg);
          console.error("[tinyviewport] boot failed", err);
          if (viewport) {
            viewport.replaceChildren();
            const fail = document.createElement("div");
            fail.style.cssText =
              "font:12px/1.3 monospace;color:#c0392b;padding:0.35rem 0";
            fail.textContent = `tinyviewport failed to start: ${msg}`;
            viewport.appendChild(fail);
          }
      });
    })();
  </script>
</div>
