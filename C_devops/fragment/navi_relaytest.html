<div
  name="relaytest"
  data-path="torus/testkit/relaytest"
  data-part="htmf"
  style="max-width:46rem;max-height:min(92vh,1200px);overflow:auto;box-sizing:border-box;font:14px/1.45 system-ui,sans-serif;"
>
  <style>
    div[name="relaytest"] .muted { color: #555; }
    div[name="relaytest"] .err { color: #a30; white-space: pre-wrap; overflow-wrap: anywhere; }
    div[name="relaytest"] .ok { color: #070; }
    div[name="relaytest"] p { margin: 0.4rem 0; }
    div[name="relaytest"] button {
      font: inherit;
      cursor: pointer;
      padding: 0.1rem 0.28rem;
    }
    div[name="relaytest"] input {
      font: inherit;
      min-width: 8rem;
      padding: 0.1rem 0.2rem;
    }
    div[name="relaytest"] [data-part="log"] {
      font: 12px/1.35 ui-monospace, monospace;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      word-break: break-word;
      border: 1px solid #ccc;
      padding: 0.4rem;
      min-height: 8rem;
      max-height: 18rem;
      overflow: auto;
    }
    div[name="relaytest"] .spin {
      display: inline-block;
      width: 0.85rem;
      height: 0.85rem;
      border: 2px solid #bbb;
      border-top-color: #222;
      border-radius: 50%;
      vertical-align: -0.15rem;
      margin-right: 0.4rem;
      animation: relaytest-spin 0.7s linear infinite;
    }
    @keyframes relaytest-spin {
      to { transform: rotate(360deg); }
    }
  </style>

  <h1>relaytest</h1>
  <p class="muted">
    Both devices: connect + advertise. Plant a small ping tip, then GET it (and
    skelly help / export) from the peer. Log shows status, bytes, and ms â€” not
    the full body.
  </p>
  <hr>
  <div data-part="relay-status" class="muted">relay statusâ€¦</div>
  <p>
    <label>token <input data-part="relay-token" autocomplete="off" placeholder="empty = open"></label>
    <button type="button" data-part="relay-connect">connect</button>
    <button type="button" data-part="relay-disconnect">disconnect</button>
  </p>
  <p>
    <label>my alias <input data-part="relay-alias" placeholder="tts" autocomplete="off"></label>
    <button type="button" data-part="relay-advertise">advertise</button>
    <button type="button" data-part="relay-status-btn">status</button>
  </p>
  <div data-part="relay-result"></div>
  <hr>
  <p>
    <label>peer alias <input data-part="peer" placeholder="vip" autocomplete="off"></label>
  </p>
  <p>
    <button type="button" data-part="plant">plant/bump local ping</button>
    <button type="button" data-part="get-ping">GET peer ping</button>
    <button type="button" data-part="get-help">GET peer skelly help</button>
    <button type="button" data-part="get-export">GET peer skelly export</button>
    <span data-part="busy" hidden><span class="spin"></span>workingâ€¦</span>
  </p>
  <div data-part="local" class="muted">local ping: â€¦</div>
  <div data-part="log"></div>

  <script>
    (function () {
      const root =
        (document.currentScript &&
          document.currentScript.closest('div[name="relaytest"]')) ||
        document.querySelector('div[name="relaytest"]');
      if (!root) return;

      const PING_IB = "navi:relaytest:ping";
      const part = (name) => root.querySelector('[data-part="' + name + '"]');

      const nowStamp = () => {
        try {
          if (navi && navi.stamp && typeof navi.stamp.time === "function") {
            return navi.stamp.time();
          }
        } catch {
          /* fall through */
        }
        return new Date().toISOString();
      };

      const log = (line, cls) => {
        const el = part("log");
        if (!el) return;
        const row = document.createElement("div");
        if (cls) row.className = cls;
        row.textContent = nowStamp() + "  " + line;
        el.appendChild(row);
        el.scrollTop = el.scrollHeight;
      };

      const peerAlias = () =>
        String((part("peer") && part("peer").value) || "")
          .trim()
          .replace(/^navi-/, "");

      const setBusy = (on) => {
        const el = part("busy");
        if (el) el.hidden = !on;
      };

      async function refreshRelayStatus() {
        const el = part("relay-status");
        if (!el) return;
        try {
          if (typeof navi === "undefined" || !navi) throw new Error("navi unavailable");
          el.textContent = String((await navi("relay status")) || "");
          el.className = "";
        } catch (e) {
          el.textContent =
            "relay status error: " + (e && e.message ? e.message : String(e));
          el.className = "err";
        }
      }

      async function runRelay(fn) {
        const result = part("relay-result");
        setBusy(true);
        if (result) {
          result.textContent = "";
          result.className = "muted";
        }
        try {
          if (typeof navi === "undefined" || !navi) throw new Error("navi unavailable");
          const out = await fn();
          if (result) {
            result.textContent = String(out || "ok");
            result.className = "ok";
          }
          await refreshRelayStatus();
        } catch (e) {
          if (result) {
            result.textContent =
              "error: " + (e && e.message ? e.message : String(e));
            result.className = "err";
          }
        } finally {
          setBusy(false);
        }
      }

      async function readPing() {
        if (typeof navi === "undefined" || !navi || !navi.storage) return null;
        const tip = await navi.storage.tip.get(PING_IB);
        if (!tip || !tip.ib) return null;
        let body = "";
        try {
          body = await navi.storage.bin.mediaFromTip(PING_IB);
        } catch {
          body = "";
        }
        let json = null;
        try {
          json = body ? JSON.parse(body) : null;
        } catch {
          json = null;
        }
        return { tip, body, json };
      }

      async function refreshLocal() {
        const el = part("local");
        if (!el) return;
        try {
          const rec = await readPing();
          if (!rec) {
            el.textContent = "local ping: (none)";
            return;
          }
          const n = rec.json && rec.json.n != null ? rec.json.n : "?";
          el.textContent =
            "local ping: n=" +
            n +
            (rec.tip.gib ? "  " + rec.tip.ib + "^" + rec.tip.gib.slice(0, 8) + "â€¦" : "");
        } catch (e) {
          el.textContent =
            "local ping: " + (e && e.message ? e.message : String(e));
        }
      }

      async function plantPing() {
        setBusy(true);
        try {
          if (typeof navi === "undefined" || !navi || !navi.storage) {
            throw new Error("navi.storage unavailable");
          }
          const prev = await readPing();
          const n = prev && prev.json && Number(prev.json.n) ? Number(prev.json.n) + 1 : 1;
          const payload = JSON.stringify({
            n,
            at: nowStamp(),
            note: "relaytest ping",
          });
          const sha = await navi.storage.bin.putMedia({
            media: payload,
            mime: "application/json; charset=utf-8",
          });
          const ref = navi.storage.bin.ref(sha);
          const data = {
            parts: ["relaytest_ping", "ibgib_frame", "manifest", "json"],
            park: "defer",
            default_method: "GET",
            content_type: "application/json; charset=utf-8",
            n,
            http: { GET: { kind: "bin", mode: "sync" } },
            about: { label: "relaytest ping" },
          };
          if (prev && prev.tip && prev.tip.data) {
            await navi.storage.tip.mut8(PING_IB, data, { rel8ns: { bin: [ref] } });
          } else {
            await navi.storage.tip.set({
              ib: PING_IB,
              gib: "",
              data,
              rel8ns: { bin: [ref], past: [], tjp: [], dna: [] },
            });
          }
          log("planted " + PING_IB + " n=" + n + " (" + payload.length + " bytes)", "ok");
          await refreshLocal();
        } catch (e) {
          log("plant fail: " + (e && e.message ? e.message : String(e)), "err");
        } finally {
          setBusy(false);
        }
      }

      async function timedGet(label, path) {
        if (typeof navi === "undefined" || !navi || typeof navi.resolveUrl !== "function") {
          throw new Error("navi.resolveUrl unavailable");
        }
        const url = navi.resolveUrl(path);
        const t0 =
          typeof performance !== "undefined" && performance.now
            ? performance.now()
            : Date.now();
        const res = await fetch(url, {
          headers: { Accept: "application/json, text/plain, */*" },
        });
        const text = await res.text();
        const ms = Math.round(
          (typeof performance !== "undefined" && performance.now
            ? performance.now()
            : Date.now()) - t0
        );
        let preview = text.slice(0, 180).replace(/\s+/g, " ");
        try {
          const j = JSON.parse(text);
          if (j && j.error) preview = "error: " + String(j.error);
          else if (j && j.kind) {
            preview =
              "kind=" +
              j.kind +
              " tips=" +
              (j.tip_count != null ? j.tip_count : "?") +
              " bins=" +
              (j.bin_count != null ? j.bin_count : "?");
          }
        } catch {
          /* keep slice */
        }
        const line =
          label +
          "  " +
          res.status +
          "  " +
          text.length +
          "B  " +
          ms +
          "ms  " +
          path +
          "  " +
          preview;
        log(line, res.ok ? "ok" : "err");
        return { res, text, ms };
      }

      async function getPeer(kind) {
        const alias = peerAlias();
        if (!alias) {
          log("peer alias required", "err");
          return;
        }
        setBusy(true);
        try {
          if (kind === "ping") {
            await timedGet("ping", "/navi-" + alias + "/relaytest/ping");
          } else if (kind === "help") {
            await timedGet("skelly help", "/navi-" + alias + "/mod/skelly");
          } else {
            await timedGet("skelly export", "/navi-" + alias + "/mod/skelly/export");
          }
        } catch (e) {
          log(
            kind + " fail: " + (e && e.message ? e.message : String(e)),
            "err"
          );
        } finally {
          setBusy(false);
        }
      }

      const connectBtn = part("relay-connect");
      const disconnectBtn = part("relay-disconnect");
      const advertiseBtn = part("relay-advertise");
      const statusBtn = part("relay-status-btn");
      const plantBtn = part("plant");
      const pingBtn = part("get-ping");
      const helpBtn = part("get-help");
      const exportBtn = part("get-export");

      if (connectBtn) {
        connectBtn.addEventListener("click", () =>
          runRelay(async () => {
            const token = String(
              (part("relay-token") && part("relay-token").value) || ""
            ).trim();
            if (token) await navi("relay token " + token);
            return await navi("relay connect");
          })
        );
      }
      if (disconnectBtn) {
        disconnectBtn.addEventListener("click", () =>
          runRelay(async () => await navi("relay disconnect"))
        );
      }
      if (advertiseBtn) {
        advertiseBtn.addEventListener("click", () =>
          runRelay(async () => {
            const alias = String(
              (part("relay-alias") && part("relay-alias").value) || ""
            )
              .trim()
              .replace(/^navi-/, "");
            if (!alias) throw new Error("alias required");
            return await navi("relay advertise " + alias);
          })
        );
      }
      if (statusBtn) {
        statusBtn.addEventListener("click", () => {
          setBusy(true);
          refreshRelayStatus().finally(() => setBusy(false));
        });
      }
      if (plantBtn) plantBtn.addEventListener("click", plantPing);
      if (pingBtn) pingBtn.addEventListener("click", () => getPeer("ping"));
      if (helpBtn) helpBtn.addEventListener("click", () => getPeer("help"));
      if (exportBtn) exportBtn.addEventListener("click", () => getPeer("export"));

      void refreshRelayStatus();
      void refreshLocal();
    })();
  </script>
</div>
